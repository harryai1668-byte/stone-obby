<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  500
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.HemisphereLight(0xffffff, 0x668866, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(20, 30, 20);
sun.castShadow = true;
scene.add(sun);

// =======================
// MAP
// =======================

const platforms = [];

function platform(x, y, z, w, h, d) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: 0x777777 })
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);

  platforms.push({
    mesh,
    w,
    h,
    d
  });
}

// START
platform(0, -1, 0, 14, 2, 14);

// OBBY
platform(0, 0, -10, 9, 1.5, 7);
platform(5, 1, -20, 7, 1.5, 7);
platform(-2, 2, -30, 7, 1.5, 7);
platform(6, 3, -40, 7, 1.5, 7);
platform(0, 4, -50, 8, 1.5, 7);
platform(-7, 5, -60, 7, 1.5, 7);
platform(0, 6, -70, 9, 1.5, 8);
platform(7, 7, -81, 7, 1.5, 7);
platform(0, 8, -92, 12, 1.5, 10);

// =======================
// BACON PLAYER
// =======================

const player = new THREE.Group();
scene.add(player);

let baconModel = null;
let mixer = null;

const loader = new GLTFLoader();

loader.load(
  "./scene.gltf",

  function (gltf) {

    baconModel = gltf.scene;

    baconModel.traverse(function (obj) {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
      }
    });

    // Tự căn kích thước Bacon
    const box = new THREE.Box3().setFromObject(baconModel);
    const size = box.getSize(new THREE.Vector3());

    const targetHeight = 2.4;
    const scale = targetHeight / size.y;

    baconModel.scale.setScalar(scale);

    // Đặt chân Bacon xuống đất
    const box2 = new THREE.Box3().setFromObject(baconModel);

    baconModel.position.y -= box2.min.y;

    player.add(baconModel);

    // Animation có sẵn trong model
    if (gltf.animations && gltf.animations.length > 0) {

      mixer = new THREE.AnimationMixer(baconModel);

      const animation = gltf.animations[0];

      const action = mixer.clipAction(animation);

      action.play();

      console.log(
        "🥓 Bacon animation:",
        animation.name
      );
    }

    console.log("🥓 BACON LOADED!");
  },

  undefined,

  function (error) {
    console.error("❌ BACON LOAD ERROR:", error);
  }
);

// Spawn
const spawn = new THREE.Vector3(0, 1.3, 3);
player.position.copy(spawn);

// =======================
// PHYSICS
// =======================

let velocityY = 0;
let grounded = false;

const gravity = -20;
const jumpPower = 7.5;
const speed = 7;

// =======================
// KEYBOARD
// =======================

const keys = {};

addEventListener("keydown", e => {

  keys[e.code] = true;

  if (e.code === "Space") {
    e.preventDefault();
  }

});

addEventListener("keyup", e => {
  keys[e.code] = false;
});

// =======================
// JUMP
// =======================

function jump() {

  if (grounded) {

    velocityY = jumpPower;

    grounded = false;

  }

}

// =======================
// UPDATE
// =======================

const clock = new THREE.Clock();

function update(dt) {

  let x = 0;
  let z = 0;

  if (keys.KeyW) z -= 1;
  if (keys.KeyS) z += 1;
  if (keys.KeyA) x -= 1;
  if (keys.KeyD) x += 1;

  const length = Math.hypot(x, z);

  if (length > 0) {

    x /= length;
    z /= length;

    player.position.x += x * speed * dt;
    player.position.z += z * speed * dt;

    // Bacon quay theo hướng chạy
    player.rotation.y = Math.atan2(x, z);

  }

  if (keys.Space) {

    jump();

    keys.Space = false;

  }

  // GRAVITY
  velocityY += gravity * dt;

  player.position.y += velocityY * dt;

  grounded = false;

  // COLLISION
  for (const p of platforms) {

    const m = p.mesh;

    const insideX =
      Math.abs(player.position.x - m.position.x)
      <= p.w / 2;

    const insideZ =
      Math.abs(player.position.z - m.position.z)
      <= p.d / 2;

    const top =
      m.position.y + p.h / 2;

    if (
      insideX &&
      insideZ &&
      player.position.y <= top + 1.3 &&
      player.position.y >= top - 1 &&
      velocityY <= 0
    ) {

      player.position.y = top + 1.2;

      velocityY = 0;

      grounded = true;

    }

  }

  // FALL = RESPAWN
  if (player.position.y < -10) {

    player.position.copy(spawn);

    velocityY = 0;

  }

  // ANIMATION
  if (mixer) {

    mixer.update(dt);

  }

}

// =======================
// CAMERA
// =======================

function updateCamera(dt) {

  const desired = new THREE.Vector3(
    player.position.x,
    player.position.y + 4,
    player.position.z + 8
  );

  camera.position.lerp(
    desired,
    1 - Math.pow(0.001, dt)
  );

  camera.lookAt(
    player.position.x,
    player.position.y + 1,
    player.position.z - 2
  );

}

// =======================
// LOOP
// =======================

function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.033);

  update(dt);
  updateCamera(dt);

  renderer.render(scene, camera);

}

animate();

// RESIZE
addEventListener("resize", () => {

  camera.aspect = innerWidth / innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});
</script>
