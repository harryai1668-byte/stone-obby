<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Obby</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}
canvas{display:block}

#ui{
    position:fixed;
    top:15px;
    left:15px;
    z-index:10;
    padding:12px 16px;
    color:white;
    background:rgba(0,0,0,.65);
    border-radius:12px;
    font-size:18px;
    line-height:1.5;
}

#help{
    position:fixed;
    bottom:15px;
    left:15px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px 14px;
    border-radius:10px;
}

#win{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.7);
    color:white;
}

#win h1{
    font-size:55px;
    margin:0 0 20px;
}

#win button{
    border:0;
    border-radius:10px;
    padding:12px 25px;
    font-size:20px;
}
</style>
</head>

<body>

<div id="ui">
🪨 <b>STONE OBBY</b><br>
💀 Chết: <span id="deaths">0</span><br>
🚩 Stage: <span id="stage">1</span>
</div>

<div id="help">
W A S D = Di chuyển &nbsp; | &nbsp; SPACE = Nhảy
</div>

<div id="win">
    <h1>🏆 YOU WIN!</h1>
    <button onclick="location.reload()">Chơi lại</button>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


// ================================
// SCENE
// ================================

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

scene.fog =
new THREE.Fog(
    0x87ceeb,
    35,
    180
);


// ================================
// CAMERA
// ================================

const camera =
new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.1,
    500
);


// ================================
// RENDERER
// ================================

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


// ================================
// LIGHT
// ================================

const sun =
new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    30,50,20
);

sun.castShadow = true;

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        1.4
    )
);


// ================================
// MATERIAL
// ================================

const stone =
new THREE.MeshStandardMaterial({
    color:0x777777,
    roughness:1
});

const grass =
new THREE.MeshStandardMaterial({
    color:0x4d963f,
    roughness:1
});

const skin =
new THREE.MeshStandardMaterial({
    color:0xffc28b
});

const shirt =
new THREE.MeshStandardMaterial({
    color:0x2979ff
});


// ================================
// PLATFORM
// ================================

const platforms=[];

function platform(
    x,y,z,w,d
){

    const rock =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            w,1,d
        ),
        stone
    );

    rock.position.set(
        x,y,z
    );

    rock.castShadow=true;
    rock.receiveShadow=true;

    scene.add(rock);

    platforms.push(rock);


    const grassTop =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            w+.1,
            .2,
            d+.1
        ),
        grass
    );

    grassTop.position.set(
        x,
        y+.6,
        z
    );

    grassTop.receiveShadow=true;

    scene.add(grassTop);
}


// ================================
// MAP
// ================================

platform(0,0,0,10,10);

platform(0,1.5,-8,5,5);
platform(4,3,-15,5,5);
platform(-2,4.5,-22,5,5);
platform(-7,6,-29,5,5);
platform(0,7.5,-36,6,6);
platform(7,9,-43,5,5);
platform(3,10.5,-50,5,5);
platform(-5,12,-57,6,6);
platform(-10,13.5,-65,6,6);
platform(-3,15,-73,7,7);

platform(5,16.5,-83,10,10);


// ================================
// FINISH
// ================================

const pole =
new THREE.Mesh(
    new THREE.CylinderGeometry(
        .15,.15,6
    ),
    new THREE.MeshStandardMaterial({
        color:0x70452b
    })
);

pole.position.set(
    5,20,-83
);

scene.add(pole);

const flag =
new THREE.Mesh(
    new THREE.BoxGeometry(
        3,1.5,.1
    ),
    new THREE.MeshStandardMaterial({
        color:0xff3333
    })
);

flag.position.set(
    6.4,21.5,-83
);

scene.add(flag);


// ================================
// PLAYER
// ================================

const player =
new THREE.Group();


// BODY

const body =
new THREE.Mesh(
    new THREE.BoxGeometry(
        1.2,1.8,.7
    ),
    shirt
);

body.position.y=1;

body.castShadow=true;

player.add(body);


// HEAD

const head =
new THREE.Mesh(
    new THREE.BoxGeometry(
        1,1,1
    ),
    skin
);

head.position.y=2.4;

head.castShadow=true;

player.add(head);


// SPAWN

const spawn =
new THREE.Vector3(
    0,0.75,0
);

player.position.copy(
    spawn
);

scene.add(player);


// ================================
// PHYSICS
// ================================

let velocityY=0;

const gravity=-0.045;

const jumpPower=.9;

let grounded=false;


// ================================
// INPUT
// ================================

const keys={
    w:false,
    a:false,
    s:false,
    d:false
};


window.addEventListener(
"keydown",
e=>{

    const k=e.key.toLowerCase();

    if(
        k==="w" ||
        k==="a" ||
        k==="s" ||
        k==="d"
    ){

        keys[k]=true;

        e.preventDefault();
    }


    if(e.code==="Space"){

        e.preventDefault();

        if(grounded){

            velocityY=
            jumpPower;

            grounded=false;
        }
    }
});


window.addEventListener(
"keyup",
e=>{

    const k=
    e.key.toLowerCase();

    if(
        k==="w" ||
        k==="a" ||
        k==="s" ||
        k==="d"
    ){

        keys[k]=false;
    }
});


// QUAN TRỌNG:
// Khi click ra ngoài game,
// tất cả phím được thả.

window.addEventListener(
"blur",
()=>{

    keys.w=false;
    keys.a=false;
    keys.s=false;
    keys.d=false;
});


// ================================
// RESPAWN
// ================================

let deaths=0;

function respawn(){

    deaths++;

    document.getElementById(
        "deaths"
    ).textContent=deaths;

    player.position.copy(
        spawn
    );

    velocityY=0;
}


// ================================
// COLLISION
// ================================

function checkCollision(){

    grounded=false;

    for(
        const p of platforms
    ){

        const box =
        new THREE.Box3()
        .setFromObject(p);

        const x =
        player.position.x;

        const z =
        player.position.z;

        const y =
        player.position.y;


        const insideX =
        x > box.min.x-.55 &&
        x < box.max.x+.55;

        const insideZ =
        z > box.min.z-.55 &&
        z < box.max.z+.55;


        if(
            insideX &&
            insideZ &&
            y >= box.max.y-.4 &&
            y <= box.max.y+.8 &&
            velocityY<=0
        ){

            player.position.y=
            box.max.y;

            velocityY=0;

            grounded=true;

            break;
        }
    }
}


// ================================
// PLAYER MOVEMENT
// ================================

function updatePlayer(){

    const speed=.18;


    // Chỉ di chuyển khi đang bấm phím

    if(keys.w)
        player.position.z-=speed;

    if(keys.s)
        player.position.z+=speed;

    if(keys.a)
        player.position.x-=speed;

    if(keys.d)
        player.position.x+=speed;


    // GRAVITY

    velocityY+=gravity;

    player.position.y+=
    velocityY;


    // COLLISION

    checkCollision();


    // RƠI

    if(
        player.position.y < -12
    ){

        respawn();
    }


    // FINISH

    if(
        player.position.z < -78 &&
        player.position.y > 15
    ){

        document.getElementById(
            "win"
        ).style.display="flex";
    }
}


// ================================
// CAMERA
// ================================

function updateCamera(){

    const targetX=
    player.position.x;

    const targetY=
    player.position.y+5;

    const targetZ=
    player.position.z+10;


    camera.position.x +=
    (
        targetX-
        camera.position.x
    )*.1;


    camera.position.y +=
    (
        targetY-
        camera.position.y
    )*.1;


    camera.position.z +=
    (
        targetZ-
        camera.position.z
    )*.1;


    camera.lookAt(
        player.position.x,
        player.position.y+1,
        player.position.z-3
    );
}


// ================================
// RESIZE
// ================================

window.addEventListener(
"resize",
()=>{

    camera.aspect=
    innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
});


// ================================
// START
// ================================

camera.position.set(
    0,6,11
);

function animate(){

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
