<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Stone Obby</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    top:15px;
    left:15px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.65);
    padding:12px 16px;
    border-radius:12px;
    font-size:17px;
    line-height:1.5;
    user-select:none;
}

#help{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:white;
    background:rgba(0,0,0,.6);
    padding:8px 13px;
    border-radius:10px;
    font-size:13px;
}

#mobile{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:30px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    border:2px solid rgba(255,255,255,.4);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:33px;
    top:33px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
}

#jump{
    position:absolute;
    right:30px;
    bottom:45px;
    width:90px;
    height:90px;
    border:2px solid rgba(255,255,255,.5);
    border-radius:50%;
    background:rgba(50,130,255,.7);
    color:white;
    font-size:17px;
    font-weight:bold;
    pointer-events:auto;
}

#win{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.7);
    color:white;
}

#win h1{
    font-size:50px;
}

@media(max-width:800px){
    #mobile{
        display:block;
    }

    #help{
        display:none;
    }
}
</style>
</head>

<body>

<div id="ui">
🪨 <b>STONE OBBY</b><br>
💀 Chết: <span id="deaths">0</span><br>
🚩 Stage: <span id="stage">1</span>
</div>

<div id="help">
WASD = Di chuyển &nbsp; | &nbsp; SPACE = Nhảy
</div>

<div id="mobile">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="jump">JUMP</button>
</div>

<div id="win">
    <h1>🏆 YOU WIN!</h1>
    <button onclick="location.reload()">Chơi lại</button>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


// ========================================
// SCENE
// ========================================

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x87ceeb);

scene.fog=
new THREE.Fog(
    0x87ceeb,
    35,
    180
);


// ========================================
// CAMERA
// ========================================

const camera=
new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .1,
    500
);


// ========================================
// RENDERER
// ========================================

const renderer=
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);


// ========================================
// LIGHT
// ========================================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        1.5
    )
);

const sun=
new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    30,50,20
);

sun.castShadow=true;

scene.add(sun);


// ========================================
// MATERIALS
// ========================================

const stoneMat=
new THREE.MeshStandardMaterial({
    color:0x777777,
    roughness:1
});

const grassMat=
new THREE.MeshStandardMaterial({
    color:0x4f963f,
    roughness:1
});


// ========================================
// MAP
// ========================================

const platforms=[];

function makePlatform(
    x,y,z,w,d
){

    const rock=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            w,1,d
        ),
        stoneMat
    );

    rock.position.set(
        x,y,z
    );

    rock.castShadow=true;
    rock.receiveShadow=true;

    scene.add(rock);

    platforms.push(rock);


    const grass=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            w+.1,.2,d+.1
        ),
        grassMat
    );

    grass.position.set(
        x,y+.6,z
    );

    scene.add(grass);
}


// Spawn
makePlatform(0,0,0,10,10);

// Obby
makePlatform(0,1.5,-8,5,5);
makePlatform(4,3,-15,5,5);
makePlatform(-2,4.5,-22,5,5);
makePlatform(-7,6,-29,5,5);
makePlatform(0,7.5,-36,6,6);
makePlatform(7,9,-43,5,5);
makePlatform(3,10.5,-50,5,5);
makePlatform(-5,12,-57,6,6);
makePlatform(-10,13.5,-65,6,6);
makePlatform(-3,15,-73,7,7);

// Finish
makePlatform(5,16.5,-83,10,10);


// ========================================
// FINISH FLAG
// ========================================

const pole=
new THREE.Mesh(
    new THREE.CylinderGeometry(
        .15,.15,6
    ),
    new THREE.MeshStandardMaterial({
        color:0x70452b
    })
);

pole.position.set(
    5,20,-83
);

scene.add(pole);


const flag=
new THREE.Mesh(
    new THREE.BoxGeometry(
        3,1.5,.1
    ),
    new THREE.MeshStandardMaterial({
        color:0xff3333
    })
);

flag.position.set(
    6.4,21.5,-83
);

scene.add(flag);


// ========================================
// PLAYER
// ========================================

const player=
new THREE.Group();

scene.add(player);

let mixer=null;

let actions={};

let currentAction=null;


// ========================================
// LOAD BACON
// ========================================

const loader=
new GLTFLoader();

loader.load(
    "./scene.gltf",

    gltf=>{

        const model=
        gltf.scene;

        model.scale.set(
            1.8,
            1.8,
            1.8
        );

        model.position.y=0;

        model.traverse(
            obj=>{

                if(obj.isMesh){

                    obj.castShadow=true;
                    obj.receiveShadow=true;
                }
            }
        );

        player.add(model);


        // Animation system

        if(
            gltf.animations &&
            gltf.animations.length
        ){

            mixer=
            new THREE.AnimationMixer(
                model
            );


            const clip=
            gltf.animations[0];

            actions.idle=
            mixer.clipAction(clip);

            actions.idle.play();

            currentAction=
            actions.idle;
        }
    },

    undefined,

    error=>{

        console.error(
            "Không load được Bacon:",
            error
        );
    }
);


// ========================================
// SPAWN
// ========================================

const spawn=
new THREE.Vector3(
    0,
    .75,
    0
);

player.position.copy(
    spawn
);


// ========================================
// PHYSICS
// ========================================

let velocityY=0;

const gravity=-.045;

const jumpPower=.9;

let grounded=false;


// ========================================
// CONTROLS
// ========================================

const keys={
    w:false,
    a:false,
    s:false,
    d:false
};

window.addEventListener(
    "keydown",
    e=>{

        const k=
        e.key.toLowerCase();

        if(
            ["w","a","s","d"].includes(k)
        ){

            keys[k]=true;

            e.preventDefault();
        }

        if(
            e.code==="Space"
        ){

            e.preventDefault();

            jump();
        }
    }
);

window.addEventListener(
    "keyup",
    e=>{

        const k=
        e.key.toLowerCase();

        if(
            ["w","a","s","d"].includes(k)
        ){

            keys[k]=false;
        }
    }
);

window.addEventListener(
    "blur",
    ()=>{

        keys.w=false;
        keys.a=false;
        keys.s=false;
        keys.d=false;
    }
);


// ========================================
// JUMP
// ========================================

function jump(){

    if(grounded){

        velocityY=
        jumpPower;

        grounded=false;
    }
}


// ========================================
// MOBILE JOYSTICK
// ========================================

const joystick=
document.getElementById(
    "joystick"
);

const stick=
document.getElementById(
    "stick"
);

let joyX=0;
let joyY=0;
let touching=false;


function updateJoystick(
    x,
    y
){

    const rect=
    joystick.getBoundingClientRect();

    const cx=
    rect.left+
    rect.width/2;

    const cy=
    rect.top+
    rect.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=45;

    const dist=
    Math.sqrt(
        dx*dx+dy*dy
    );

    if(dist>max){

        dx=
        dx/dist*max;

        dy=
        dy/dist*max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}


joystick.addEventListener(
    "touchstart",
    e=>{

        touching=true;

        updateJoystick(
            e.touches[0].clientX,
            e.touches[0].clientY
        );
    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        if(!touching)
            return;

        e.preventDefault();

        updateJoystick(
            e.touches[0].clientX,
            e.touches[0].clientY
        );
    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    ()=>{

        touching=false;

        joyX=0;
        joyY=0;

        stick.style.transform=
        "translate(0,0)";
    }
);


document.getElementById(
    "jump"
).addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        jump();
    },
    {passive:false}
);


// ========================================
// COLLISION
// ========================================

function collision(){

    grounded=false;

    for(
        const p of platforms
    ){

        const box=
        new THREE.Box3()
        .setFromObject(p);

        const x=
        player.position.x;

        const z=
        player.position.z;

        const y=
        player.position.y;


        const insideX=
        x>box.min.x-.6 &&
        x<box.max.x+.6;

        const insideZ=
        z>box.min.z-.6 &&
        z<box.max.z+.6;


        if(
            insideX &&
            insideZ &&
            y>=box.max.y-.4 &&
            y<=box.max.y+.8 &&
            velocityY<=0
        ){

            player.position.y=
            box.max.y;

            velocityY=0;

            grounded=true;

            break;
        }
    }
}


// ========================================
// DEATH
// ========================================

let deaths=0;

function respawn(){

    deaths++;

    document.getElementById(
        "deaths"
    ).textContent=deaths;

    player.position.copy(
        spawn
    );

    velocityY=0;
}


// ========================================
// PLAYER UPDATE
// ========================================

function updatePlayer(
    delta
){

    let x=0;
    let z=0;


    // PC

    if(keys.a)x-=1;
    if(keys.d)x+=1;
    if(keys.w)z-=1;
    if(keys.s)z+=1;


    // Mobile

    if(
        Math.abs(joyX)>.05 ||
        Math.abs(joyY)>.05
    ){

        x=joyX;
        z=joyY;
    }


    const moving=
        Math.abs(x)>.05 ||
        Math.abs(z)>.05;


    const speed=.18;


    player.position.x+=
    x*speed;

    player.position.z+=
    z*speed;


    // Gravity

    velocityY+=gravity;

    player.position.y+=
    velocityY;


    collision();


    // Fall

    if(
        player.position.y<-12
    ){

        respawn();
    }


    // Finish

    if(
        player.position.z<-78 &&
        player.position.y>15
    ){

        document.getElementById(
            "win"
        ).style.display="flex";
    }


    // Face movement direction

    if(moving){

        player.rotation.y=
        Math.atan2(
            x,
            z
        );
    }


    // Animation

    if(mixer){

        mixer.update(delta);
    }
}


// ========================================
// CAMERA
// ========================================

function updateCamera(){

    const target=
    new THREE.Vector3(
        player.position.x,
        player.position.y+5,
        player.position.z+11
    );

    camera.position.lerp(
        target,
        .1
    );

    camera.lookAt(
        player.position.x,
        player.position.y+1,
        player.position.z-3
    );
}


// ========================================
// RESIZE
// ========================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


// ========================================
// START
// ========================================

camera.position.set(
    0,6,11
);

const clock=
new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
    clock.getDelta();

    updatePlayer(delta);

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
