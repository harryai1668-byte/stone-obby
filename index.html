<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stone Obby</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb;touch-action:none}
canvas{display:block}
#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;color:white;text-align:center;font-size:27px;font-weight:900;text-shadow:0 2px 5px #333;pointer-events:none}
#hint{position:fixed;top:51px;left:50%;transform:translateX(-50%);z-index:5;color:white;font-size:14px;font-weight:700;text-shadow:0 2px 4px #333;pointer-events:none;white-space:nowrap}
#joy{display:none;position:fixed;left:25px;bottom:30px;width:120px;height:120px;border:3px solid white;border-radius:50%;background:#ffffff33;z-index:10}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#fff}
#jump{display:none;position:fixed;right:25px;bottom:30px;width:120px;height:120px;border:3px solid white;border-radius:50%;background:#ffffff33;color:#fff;font-weight:900;font-size:17px;z-index:10}
#win{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;background:#0008}
#winbox{background:#222;color:white;padding:30px 40px;border-radius:18px;text-align:center;box-shadow:0 10px 40px #0008}
#win button{border:0;border-radius:10px;padding:12px 22px;font-weight:800;cursor:pointer}
@media(max-width:800px){#joy,#jump{display:block}#title{font-size:23px}}
</style>
</head>
<body>
<div id="title">🪨 STONE OBBY</div>
<div id="hint">WASD để di chuyển • SPACE để nhảy</div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">JUMP</button>
<div id="win"><div id="winbox"><h1>🎉 YOU WIN!</h1><button onclick="location.reload()">Chơi lại</button></div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,55,220);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557755,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(25,45,20); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const platforms=[];
function platform(x,y,z,w,h,d){
  const m=new THREE.MeshStandardMaterial({color:0x707070,roughness:.9});
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  b.position.set(x,y,z); b.castShadow=true;b.receiveShadow=true;scene.add(b);
  const grass=new THREE.MeshStandardMaterial({color:0x63ad48,roughness:1});
  const t=new THREE.Mesh(new THREE.BoxGeometry(w-.08,.12,d-.08),grass);
  t.position.set(x,y+h/2+.06,z);t.receiveShadow=true;scene.add(t);
  platforms.push({x,y,z,w,h,d});
}
platform(0,-1,0,14,2,14);
platform(0,0,-10,9,1.5,7);
platform(5,1,-20,7,1.5,7);
platform(-2,2,-30,7,1.5,7);
platform(6,3,-40,7,1.5,7);
platform(0,4,-50,8,1.5,7);
platform(-7,5,-60,7,1.5,7);
platform(0,6,-70,9,1.5,8);
platform(7,7,-81,7,1.5,7);
platform(0,8,-92,12,1.5,10);

const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,4,12),new THREE.MeshStandardMaterial({color:0xffffff}));
pole.position.set(0,10.75,-92);scene.add(pole);
const flag=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.2),new THREE.MeshStandardMaterial({color:0xff4040,side:THREE.DoubleSide}));
flag.position.set(1.05,11.7,-92);scene.add(flag);

/* ===== NEW PLAYER: stylized hoodie character ===== */
const player=new THREE.Group(); scene.add(player);
const visual=new THREE.Group(); player.add(visual);

const mat={
 skin:new THREE.MeshStandardMaterial({color:0xffd6b0,roughness:.75}),
 hair:new THREE.MeshStandardMaterial({color:0x4a2a18,roughness:.85}),
 hoodie:new THREE.MeshStandardMaterial({color:0x3b5cff,roughness:.8}),
 dark:new THREE.MeshStandardMaterial({color:0x20252f,roughness:.85}),
 shoe:new THREE.MeshStandardMaterial({color:0xf3f3f3,roughness:.8}),
 eye:new THREE.MeshBasicMaterial({color:0x151515}),
 white:new THREE.MeshBasicMaterial({color:0xffffff})
};
function box(parent,x,y,z,w,h,d,material,rad=0){
  const g=new THREE.BoxGeometry(w,h,d);
  const mesh=new THREE.Mesh(g,material);
  mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);
  return mesh;
}
function sphere(parent,x,y,z,r,material){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),material);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}

/* Feet at local y=0; visual is never used for physics. */
const leftLeg=box(visual,-.24,.58,0,.34,1.0,.38,mat.dark);
const rightLeg=box(visual,.24,.58,0,.34,1.0,.38,mat.dark);
const leftFoot=box(visual,-.24,.08,-.07,.40,.16,.55,mat.shoe);
const rightFoot=box(visual,.24,.08,-.07,.40,.16,.55,mat.shoe);

const torso=box(visual,0,1.38,0,.92,1.0,.52,mat.hoodie);
const hood=sphere(visual,0,1.92,.02,.39,mat.hoodie);
hood.scale.set(1,0.72,.72);

const leftArm=box(visual,-.59,1.39,0,.28,.9,.34,mat.hoodie);
const rightArm=box(visual,.59,1.39,0,.28,.9,.34,mat.hoodie);
const leftHand=sphere(visual,-.59,.89,0,.18,mat.skin);
const rightHand=sphere(visual,.59,.89,0,.18,mat.skin);

const head=sphere(visual,0,2.25,0,.48,mat.skin);
head.scale.set(.92,1,.9);

/* Hair cap + fringe */
const hair=sphere(visual,0,2.53,.01,.50,mat.hair);
hair.scale.set(1,.62,.95);
for(let i=-2;i<=2;i++){
  const fringe=sphere(visual,i*.16,2.43,-.42,.15,mat.hair);
  fringe.scale.set(1,.8,.55);
}
/* Eyes + tiny smile, front is -Z */
sphere(visual,-.17,2.28,-.435,.045,mat.eye);
sphere(visual,.17,2.28,-.435,.045,mat.eye);
const mouth=box(visual,0,2.10,-.445,.18,.035,.02,mat.eye);

/* Hoodie drawstring */
for(const x of [-.08,.08]) box(visual,x,1.75,-.275,.025,.22,.025,mat.white);

/* subtle backpack */
box(visual,0,1.45,.32,.68,.78,.16,mat.dark);

const spawn=new THREE.Vector3(0,0,3);
player.position.copy(spawn);
const R=.30,H=2.55,SPEED=7,GRAVITY=20,JUMP=7.6;
let vy=0,grounded=true,finished=false,moving=false;
const keys={};

addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="Space")e.preventDefault()});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("blur",()=>{for(const k in keys)delete keys[k];joyX=joyY=0;knob.style.transform="translate(0,0)"});

let joyX=0,joyY=0,joyOn=false;
const joy=document.getElementById("joy"),knob=document.getElementById("knob");
function joyMove(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let x=e.clientX-cx,y=e.clientY-cy,len=Math.hypot(x,y),max=48;
 if(len>max){x=x/len*max;y=y/len*max}
 joyX=x/max;joyY=y/max;knob.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener("pointerdown",e=>{joyOn=true;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener("pointermove",e=>{if(joyOn)joyMove(e)});
function joyUp(){joyOn=false;joyX=joyY=0;knob.style.transform="translate(0,0)"}
joy.addEventListener("pointerup",joyUp);joy.addEventListener("pointercancel",joyUp);
let jumpTap=false;
document.getElementById("jump").addEventListener("pointerdown",()=>jumpTap=true);

function inside(p,x,z){
 return x>p.x-p.w/2-R*.75 && x<p.x+p.w/2+R*.75 &&
        z>p.z-p.d/2-R*.75 && z<p.z+p.d/2+R*.75;
}
function overlapY(p){
 const feet=player.position.y,head=feet+H,b=p.y-p.h/2,t=p.y+p.h/2;
 return head>b+.001 && feet<t-.001;
}
/* Solid horizontal collision, sub-stepped to stop tunneling. */
function moveXZ(dx,dz){
  // Smooth horizontal movement: never snap/push the player away from edges.
  const maxStep=.045;
  const n=Math.max(1,Math.ceil(Math.hypot(dx,dz)/maxStep));
  for(let i=0;i<n;i++){
    player.position.x+=dx/n;
    player.position.z+=dz/n;
  }
}
function moveY(dt){
  const maxStep=.006;
  const n=Math.max(1,Math.ceil(dt/maxStep));
  const step=dt/n;

  for(let i=0;i<n;i++){
    const oldY=player.position.y;
    const oldV=vy;
    vy-=GRAVITY*step;
    const nextY=oldY+vy*step;
    let landingTop=null;

    if(oldV<=0){
      for(const p of platforms){
        const inX=player.position.x>=p.x-p.w/2+.12 && player.position.x<=p.x+p.w/2-.12;
        const inZ=player.position.z>=p.z-p.d/2+.12 && player.position.z<=p.z+p.d/2-.12;
        if(!inX||!inZ) continue;
        const top=p.y+p.h/2;
        if(oldY>=top && nextY<=top && (landingTop===null||top>landingTop)) landingTop=top;
      }
    }

    if(landingTop!==null){
      player.position.y=landingTop; vy=0; grounded=true; continue;
    }

    if(oldV>0){
      let ceiling=null;
      for(const p of platforms){
        const inX=player.position.x>=p.x-p.w/2+.12 && player.position.x<=p.x+p.w/2-.12;
        const inZ=player.position.z>=p.z-p.d/2+.12 && player.position.z<=p.z+p.d/2-.12;
        if(!inX||!inZ) continue;
        const bottom=p.y-p.h/2;
        if(oldY+H<=bottom && nextY+H>=bottom && (ceiling===null||bottom<ceiling)) ceiling=bottom;
      }
      if(ceiling!==null){player.position.y=ceiling-H-.001;vy=0;}
      else player.position.y=nextY;
    }else player.position.y=nextY;

    grounded=false;
    if(vy<=0){
      for(const p of platforms){
        const top=p.y+p.h/2;
        const inX=player.position.x>=p.x-p.w/2+.12 && player.position.x<=p.x+p.w/2-.12;
        const inZ=player.position.z>=p.z-p.d/2+.12 && player.position.z<=p.z+p.d/2-.12;
        if(inX&&inZ&&Math.abs(player.position.y-top)<.025){
          player.position.y=top;vy=0;grounded=true;break;
        }
      }
    }
  }
}
function animateCharacter(dt){
 const movingNow=moving && grounded;
 const t=performance.now()*.012;
 const swing=movingNow?Math.sin(t)*.55:0;
 leftLeg.rotation.x=swing;rightLeg.rotation.x=-swing;
 leftArm.rotation.x=-swing*.75;rightArm.rotation.x=swing*.75;
 visual.position.y=movingNow?Math.abs(Math.sin(t))*-.035:0;
 /* Face direction of travel. Model's front is -Z. */
 if(moving){
   const angle=Math.atan2(-moveX,-moveZ);
   visual.rotation.y=angle;
 }else visual.rotation.y=0;
}
let moveX=0,moveZ=0;
function update(dt){
 if(finished)return;
 let x=0,z=0;
 if(keys.KeyA)x-=1;if(keys.KeyD)x+=1;if(keys.KeyW)z-=1;if(keys.KeyS)z+=1;
 if(joyOn){x=joyX;z=joyY}
 if(Math.hypot(x,z)>1){const l=Math.hypot(x,z);x/=l;z/=l}
 moveX=x;moveZ=z;moving=Math.hypot(x,z)>.08;
 moveXZ(x*SPEED*dt,z*SPEED*dt);
 if((keys.Space||jumpTap)&&grounded){keys.Space=false;jumpTap=false;vy=JUMP;grounded=false}
 else {keys.Space=false;jumpTap=false}
 moveY(dt);
 animateCharacter(dt);
 if(player.position.y<-15){player.position.copy(spawn);vy=0;grounded=true}
 if(player.position.z<-88&&player.position.y>7){finished=true;document.getElementById("win").style.display="flex"}
}
const desired=new THREE.Vector3();
function cam(dt){
 desired.set(player.position.x,player.position.y+3.2,player.position.z+8.5);
 camera.position.lerp(desired,1-Math.pow(.0008,dt));
 camera.lookAt(player.position.x,player.position.y+1.15,player.position.z-3.5);
}
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);update(dt);cam(dt);renderer.render(scene,camera)}
loop();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
