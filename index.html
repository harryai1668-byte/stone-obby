<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stone Obby</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#title{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;font-size:28px;font-weight:900;text-shadow:0 2px 5px #000;text-align:center;pointer-events:none}
#hint{position:fixed;top:55px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;text-shadow:0 2px 4px #000;font-size:14px;white-space:nowrap;pointer-events:none}
#joy{display:none;position:fixed;left:25px;bottom:28px;width:120px;height:120px;border:3px solid #fff;border-radius:50%;background:#ffffff33;z-index:10;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#ffffffaa}
#jump{display:none;position:fixed;right:25px;bottom:28px;width:90px;height:90px;border:3px solid #fff;border-radius:50%;background:#ffffff44;color:#fff;font-weight:900;z-index:10;pointer-events:auto}
#win{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;color:#fff;text-align:center}
#winbox{background:#222;padding:28px;border-radius:18px}
#winbox button{padding:12px 22px;border:0;border-radius:10px;font-weight:bold}
@media(max-width:800px){#joy,#jump{display:block}#title{font-size:23px}#hint{font-size:12px}}
</style>
</head>
<body>
<div id="title">🥓 STONE OBBY</div>
<div id="hint">WASD để di chuyển • SPACE để nhảy</div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">JUMP</button>
<div id="win"><div id="winbox"><h1>🏆 YOU WIN!</h1><p>Bro đã hoàn thành Obby 😎</p><button onclick="location.reload()">Chơi lại</button></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x668866,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(20,35,20);
sun.castShadow=true;
scene.add(sun);

const platforms=[];
function platform(x,y,z,w,h,d){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color:0x777777,roughness:.9})
  );
  m.position.set(x,y,z);
  m.castShadow=true;m.receiveShadow=true;
  scene.add(m);
  platforms.push({m,w,h,d});
  const grass=new THREE.Mesh(
    new THREE.BoxGeometry(w-.12,.12,d-.12),
    new THREE.MeshStandardMaterial({color:0x5f9e45,roughness:1})
  );
  grass.position.set(x,y+h/2+.06,z);
  grass.receiveShadow=true;
  scene.add(grass);
}

platform(0,-1,0,14,2,14);
platform(0,0,-10,9,1.5,7);
platform(5,1,-20,7,1.5,7);
platform(-2,2,-30,7,1.5,7);
platform(6,3,-40,7,1.5,7);
platform(0,4,-50,8,1.5,7);
platform(-7,5,-60,7,1.5,7);
platform(0,6,-70,9,1.5,8);
platform(7,7,-81,7,1.5,7);
platform(0,8,-92,12,1.5,10);

const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.08,.08,4,12),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
pole.position.set(0,10,-92);scene.add(pole);
const flag=new THREE.Mesh(
  new THREE.PlaneGeometry(2.2,1.2),
  new THREE.MeshStandardMaterial({color:0xff3333,side:THREE.DoubleSide})
);
flag.position.set(1.05,11,-92);scene.add(flag);

const player=new THREE.Group();
scene.add(player);

let mixer=null,runAction=null,bacon=null,modelReady=false;
let moving=false;

const loader=new GLTFLoader();
loader.load("./scene.gltf?v=roblox-bacon-5",(gltf)=>{
  bacon=gltf.scene;

  bacon.traverse(o=>{
    if(o.isMesh){
      o.visible=true;
      o.castShadow=true;
      o.receiveShadow=true;
      if(o.material){
        o.material.transparent=false;
        o.material.opacity=1;
        o.depthWrite=true;
      }
    }
  });

  /*
    IMPORTANT:
    This specific Bacon file is ~0.05566 units tall in its source data.
    0.0.36x -> ~2.00 units tall, which is the intended Roblox-like size.
  */
  bacon.scale.setScalar(0.36);
  bacon.updateMatrixWorld(true);

  // Center X/Z only. Do NOT recenter Y with a second scale operation.
  const b=new THREE.Box3().setFromObject(bacon);
  const c=b.getCenter(new THREE.Vector3());
  bacon.position.x-=c.x;
  bacon.position.z-=c.z;
  bacon.position.y-=b.min.y;

  player.add(bacon);
  modelReady=true;

  if(gltf.animations && gltf.animations.length){
    mixer=new THREE.AnimationMixer(bacon);
    runAction=mixer.clipAction(gltf.animations[0]);
    runAction.setLoop(THREE.LoopRepeat,Infinity);
    runAction.clampWhenFinished=false;
    // IMPORTANT: start paused. It will only play while moving.
    runAction.play();
    runAction.paused=true;
    console.log("🥓 BACON READY:",gltf.animations[0].name);
  }
},undefined,(err)=>{
  console.error("❌ Bacon could not load:",err);
});

const spawn=new THREE.Vector3(0,1.2,3);
player.position.copy(spawn);

const keys={};
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Space")e.preventDefault();
});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));

let joyX=0,joyY=0,joyOn=false;
const joy=document.getElementById("joy"),knob=document.getElementById("knob");
function joyMove(e){
  const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let x=e.clientX-cx,y=e.clientY-cy;
  const max=48,len=Math.hypot(x,y);
  if(len>max){x=x/len*max;y=y/len*max}
  joyX=x/max;joyY=y/max;
  knob.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener("pointerdown",e=>{joyOn=true;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener("pointermove",e=>{if(joyOn)joyMove(e)});
function joyReset(){joyOn=false;joyX=0;joyY=0;knob.style.transform="translate(0,0)"}
joy.addEventListener("pointerup",joyReset);
joy.addEventListener("pointercancel",joyReset);

let jumpPressed=false;
document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();jumpPressed=true;
});

let vy=0,grounded=false,finished=false;
function jump(){
  if(grounded){vy=7.5;grounded=false}
}

const clock=new THREE.Clock();
function update(dt){
  if(finished)return;

  let x=0,z=0;
  if(keys.KeyA)x-=1;if(keys.KeyD)x+=1;
  if(keys.KeyW)z-=1;if(keys.KeyS)z+=1;
  if(joyOn){x=joyX;z=joyY}

  const len=Math.hypot(x,z);
  if(len>1){x/=len;z/=len}
  moving=Math.hypot(x,z)>.08;

  player.position.x+=x*7*dt;
  player.position.z+=z*7*dt;

  if(moving && bacon) player.rotation.y=Math.atan2(x,z);

  if(keys.Space||jumpPressed){
    keys.Space=false;jumpPressed=false;jump();
  }

  vy-=20*dt;
  player.position.y+=vy*dt;
  grounded=false;

  for(const p of platforms){
    const top=p.m.position.y+p.h/2;
    const ix=Math.abs(player.position.x-p.m.position.x)<=p.w/2;
    const iz=Math.abs(player.position.z-p.m.position.z)<=p.d/2;
    if(ix&&iz&&player.position.y<=top+1.25&&player.position.y>=top-1&&vy<=0){
      player.position.y=top+1.2;
      vy=0;grounded=true;
    }
  }

  if(runAction){
    // The asset's only clip is treated as the run animation.
    // Standing still = completely paused.
    runAction.paused=!moving;
  }
  if(mixer)mixer.update(dt);

  if(player.position.y<-12) {
    player.position.copy(spawn);
    vy=0;
  }

  if(player.position.z<-88 && player.position.y>7){
    finished=true;
    document.getElementById("win").style.display="flex";
  }
}

function cameraUpdate(dt){
  const target=new THREE.Vector3(
    player.position.x,
    player.position.y+3.1,
    player.position.z+7.2
  );
  camera.position.lerp(target,1-Math.pow(.001,dt));
  camera.lookAt(player.position.x,player.position.y+1,player.position.z-2);
}

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.033);
  update(dt);
  cameraUpdate(dt);
  renderer.render(scene,camera);
}
loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
