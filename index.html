<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Noob Bot Arena</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#69c9ff;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#top{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
}

.box{
    background:rgba(0,0,0,.72);
    color:white;
    padding:10px 16px;
    border-radius:12px;
    font-weight:bold;
    min-width:190px;
}

.bar{
    width:180px;
    height:18px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
    margin-top:5px;
}

.hp{
    width:100%;
    height:100%;
    background:#28df52;
}

#botbar{
    background:#ef3333;
}

#skills{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
}

.skill{
    width:90px;
    height:70px;
    border-radius:12px;
    background:rgba(0,0,0,.78);
    color:white;
    text-align:center;
    padding-top:8px;
    font-weight:bold;
    border:2px solid #777;
}

.skill b{
    display:block;
    font-size:23px;
}

.cool{
    color:#aaa;
}

#coins{
    position:absolute;
    top:15px;
    right:15px;
    background:#000b;
    color:#ffd83d;
    padding:12px 18px;
    border-radius:12px;
    font-weight:bold;
}

#message{
    position:absolute;
    top:120px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:25px;
    font-weight:bold;
    text-shadow:3px 3px #000;
}

#controls{
    position:absolute;
    bottom:15px;
    left:15px;
    color:white;
    background:#0009;
    padding:10px;
    border-radius:10px;
    font-size:12px;
}

#start{
    position:fixed;
    inset:0;
    z-index:50;
    background:linear-gradient(#58c8ff,#baf1ff);
    display:flex;
    justify-content:center;
    align-items:center;
}

.panel{
    width:360px;
    background:white;
    padding:30px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 15px 50px #0004;
}

.panel h1{
    font-size:38px;
    margin:0 0 10px;
}

.panel p{
    color:#666;
}

.panel button{
    width:100%;
    border:0;
    background:#222;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#win{
    display:none;
    position:fixed;
    inset:0;
    z-index:40;
    background:#0008;
    align-items:center;
    justify-content:center;
}

.winbox{
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
}

.winbox h1{
    font-size:45px;
    margin:0 0 10px;
}

.winbox button{
    padding:12px 30px;
    border:0;
    border-radius:10px;
    background:#222;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="start">
    <div class="panel">
        <h1>⚔️ NOOB DUEL</h1>
        <p>Fight the BOT 🤖</p>
        <p>✨ Có aura + skill effects</p>
        <button onclick="startGame()">START FIGHT</button>
    </div>
</div>

<div id="ui">

    <div id="top">

        <div class="box">
            🟨 NOOB
            <div class="bar">
                <div id="myhp" class="hp"></div>
            </div>
        </div>

        <div class="box">
            🤖 BOT
            <div class="bar">
                <div id="bothp" class="hp" style="background:#ef3333"></div>
            </div>
        </div>

    </div>

    <div id="coins">
        🪙 <span id="coinText">0</span>
    </div>

    <div id="message"></div>

    <div id="skills">

        <div class="skill">
            <b>⚔️</b>
            HIT
        </div>

        <div class="skill" id="qSkill">
            <b>⚡</b>
            Q
            <div class="cool" id="qcd">READY</div>
        </div>

        <div class="skill" id="eSkill">
            <b>💥</b>
            E
            <div class="cool" id="ecd">READY</div>
        </div>

        <div class="skill" id="rSkill">
            <b>🔥</b>
            R
            <div class="cool" id="rcd">READY</div>
        </div>

    </div>

    <div id="controls">
        WASD = Move<br>
        SPACE = Jump<br>
        CLICK = Attack<br>
        Q = Aura Slash<br>
        E = Energy Burst<br>
        R = Ultimate 🔥<br>
        RMB = Camera
    </div>

</div>

<div id="win">
    <div class="winbox">
        <h1 id="result">YOU WIN!</h1>
        <p id="reward">+25 🪙</p>
        <button onclick="newRound()">NEXT ROUND</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let player;
let bot;

let keys={};

let yaw=0;
let pitch=.35;

let dragging=false;
let lastX=0;
let lastY=0;

let playerHP=100;
let botHP=100;

let coins=0;

let qCooldown=0;
let eCooldown=0;
let rCooldown=0;

let running=false;
let botAttackTimer=0;

let effects=[];

const clock=new THREE.Clock();


// ==================================================
// START
// ==================================================

function startGame(){

    document.getElementById("start").style.display="none";

    init();

    running=true;
}


// ==================================================
// MATERIAL
// ==================================================

function mat(color, emissive=0x000000){

    return new THREE.MeshStandardMaterial({
        color:color,
        emissive:emissive,
        emissiveIntensity:1
    });

}


// ==================================================
// NOOB
// ==================================================

function createNoob(color){

    const g=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(1,1.25,.7),
        mat(color)
    );

    body.position.y=1.35;
    g.add(body);


    const head=new THREE.Mesh(
        new THREE.BoxGeometry(1.05,1.05,1.05),
        mat(0xffcc99)
    );

    head.position.y=2.5;
    g.add(head);


    const eyeMat=mat(0x000000);

    const eye1=new THREE.Mesh(
        new THREE.BoxGeometry(.13,.13,.04),
        eyeMat
    );

    eye1.position.set(-.2,2.55,.53);
    g.add(eye1);


    const eye2=eye1.clone();
    eye2.position.x=.2;
    g.add(eye2);


    const legMat=mat(0x2255aa);

    const leg1=new THREE.Mesh(
        new THREE.BoxGeometry(.4,1,.4),
        legMat
    );

    leg1.position.set(-.25,.25,0);
    g.add(leg1);


    const leg2=leg1.clone();
    leg2.position.x=.25;
    g.add(leg2);


    const armMat=mat(color);

    const arm1=new THREE.Mesh(
        new THREE.BoxGeometry(.35,1.1,.4),
        armMat
    );

    arm1.position.set(-.7,1.4,0);
    g.add(arm1);


    const arm2=arm1.clone();
    arm2.position.x=.7;
    g.add(arm2);


    // SWORD

    const sword=new THREE.Mesh(
        new THREE.BoxGeometry(.13,1.7,.13),
        mat(0xeef5ff,0x555555)
    );

    sword.position.set(.9,1.35,0);
    sword.rotation.z=-.5;

    g.add(sword);


    return g;
}


// ==================================================
// ARENA
// ==================================================

function init(){

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(0x69c9ff);


    camera=new THREE.PerspectiveCamera(
        70,
        innerWidth/innerHeight,
        .1,
        1000
    );


    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    document.body.appendChild(renderer.domElement);


    // LIGHT

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x446644,
            2
        )
    );


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    sun.position.set(10,20,10);

    scene.add(sun);


    // GROUND

    const ground=new THREE.Mesh(
        new THREE.CylinderGeometry(
            15,15,.5,64
        ),
        mat(0x42b94f)
    );

    ground.position.y=-.25;

    scene.add(ground);


    // CENTER

    const center=new THREE.Mesh(
        new THREE.CylinderGeometry(
            5,5,.05,64
        ),
        mat(0x77dd77)
    );

    center.position.y=.03;

    scene.add(center);


    // RING

    const ring=new THREE.Mesh(
        new THREE.TorusGeometry(
            14.5,.3,12,64
        ),
        mat(0x1f662d)
    );

    ring.rotation.x=Math.PI/2;
    ring.position.y=.15;

    scene.add(ring);


    // TREES

    for(let i=0;i<16;i++){

        const a=i/16*Math.PI*2;

        const x=Math.cos(a)*13;
        const z=Math.sin(a)*13;


        const trunk=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25,.35,2,8
            ),
            mat(0x704214)
        );

        trunk.position.set(x,1,z);

        scene.add(trunk);


        const leaves=new THREE.Mesh(
            new THREE.SphereGeometry(
                1.3,12,12
            ),
            mat(0x168a35)
        );

        leaves.position.set(x,2.5,z);

        scene.add(leaves);
    }


    player=createNoob(0xffcc00);
    bot=createNoob(0xdd2222);

    player.position.set(-3,0,0);
    bot.position.set(3,0,0);

    scene.add(player);
    scene.add(bot);


    // CAMERA

    renderer.domElement.oncontextmenu=
        e=>e.preventDefault();


    renderer.domElement.onmousedown=e=>{

        if(e.button===2){

            dragging=true;

            lastX=e.clientX;
            lastY=e.clientY;
        }

        if(e.button===0){

            normalAttack();
        }

    };


    window.onmouseup=()=>{
        dragging=false;
    };


    window.onmousemove=e=>{

        if(!dragging)return;

        yaw-=
            (e.clientX-lastX)*.008;

        pitch+=
            (e.clientY-lastY)*.008;

        pitch=Math.max(
            -.8,
            Math.min(1.1,pitch)
        );

        lastX=e.clientX;
        lastY=e.clientY;
    };


    window.onkeydown=e=>{

        keys[e.key.toLowerCase()]=true;

        if(e.code==="Space"){
            e.preventDefault();
            jump();
        }

        if(e.key.toLowerCase()==="q"){
            auraSlash();
        }

        if(e.key.toLowerCase()==="e"){
            energyBurst();
        }

        if(e.key.toLowerCase()==="r"){
            ultimate();
        }

    };


    window.onkeyup=e=>{
        keys[e.key.toLowerCase()]=false;
    };


    animate();

}


// ==================================================
// MOVEMENT
// ==================================================

function movement(dt){

    let x=0;
    let z=0;

    if(keys.w)z-=1;
    if(keys.s)z+=1;
    if(keys.a)x-=1;
    if(keys.d)x+=1;

    if(x!==0||z!==0){

        const len=Math.hypot(x,z);

        x/=len;
        z/=len;

        player.position.x+=x*6*dt;
        player.position.z+=z*6*dt;

        player.position.x=
            Math.max(-13,
            Math.min(13,player.position.x));

        player.position.z=
            Math.max(-13,
            Math.min(13,player.position.z));
    }

}


// ==================================================
// JUMP
// ==================================================

let playerVelocityY=0;

function jump(){

    if(player.position.y<=.01){

        playerVelocityY=.5;
    }

}


// ==================================================
// BOT AI
// ==================================================

function botAI(dt){

    if(!running)return;

    const dx=
        player.position.x-
        bot.position.x;

    const dz=
        player.position.z-
        bot.position.z;

    const distance=Math.hypot(dx,dz);

    if(distance>2.2){

        const len=Math.max(distance,.001);

        bot.position.x+=
            dx/len*2.1*dt;

        bot.position.z+=
            dz/len*2.1*dt;

    }else{

        botAttackTimer-=dt;

        if(botAttackTimer<=0){

            botAttackTimer=.9;

            playerHP-=10;

            document.getElementById("myhp").style.width=
                Math.max(0,playerHP)+"%";

            hitEffect(
                player.position,
                0xff3333,
                1
            );

            if(playerHP<=0){

                lose();
            }

        }

    }

}


// ==================================================
// NORMAL ATTACK
// ==================================================

function normalAttack(){

    if(!running)return;

    const d=
        player.position.distanceTo(
            bot.position
        );

    if(d<=3){

        botHP-=12;

        damageText(
            bot.position,
            "-12"
        );

        slashEffect(
            player.position,
            0xffffff
        );

        updateHP();

        if(botHP<=0){
            win();
        }

    }else{

        slashEffect(
            player.position,
            0xffffff
        );

    }

}


// ==================================================
// Q — AURA SLASH
// ==================================================

function auraSlash(){

    if(!running||qCooldown>0)return;

    qCooldown=4;

    cooldownDisplay(
        "qcd",
        4
    );


    aura(
        player.position,
        0x00ffff,
        1.7
    );


    shockwave(
        player.position,
        0x00ffff
    );


    const d=
        player.position.distanceTo(
            bot.position
        );

    if(d<=4){

        botHP-=25;

        damageText(
            bot.position,
            "-25 ⚡"
        );

        updateHP();

        if(botHP<=0){
            win();
        }

    }

}


// ==================================================
// E — ENERGY BURST
// ==================================================

function energyBurst(){

    if(!running||eCooldown>0)return;

    eCooldown=7;

    cooldownDisplay(
        "ecd",
        7
    );


    aura(
        player.position,
        0x9b00ff,
        2.3
    );


    for(let i=0;i<20;i++){

        const p=
            player.position.clone();

        p.y+=1;

        const dir=
            new THREE.Vector3(
                Math.random()-.5,
                Math.random()-.2,
                Math.random()-.5
            ).normalize();

        particle(
            p,
            0xaa44ff,
            dir
        );

    }


    const d=
        player.position.distanceTo(
            bot.position
        );

    if(d<=5){

        botHP-=35;

        damageText(
            bot.position,
            "-35 💥"
        );

        updateHP();

        if(botHP<=0){
            win();
        }

    }

}


// ==================================================
// R — ULTIMATE
// ==================================================

function ultimate(){

    if(!running||rCooldown>0)return;

    rCooldown=15;

    cooldownDisplay(
        "rcd",
        15
    );


    // HUGE AURA

    aura(
        player.position,
        0xff4400,
        3.8
    );


    aura(
        player.position,
        0xffaa00,
        2.8
    );


    shockwave(
        player.position,
        0xff4400,
        4
    );


    for(let i=0;i<45;i++){

        const p=
            player.position.clone();

        p.y+=Math.random()*3;

        const dir=
            new THREE.Vector3(
                Math.random()-.5,
                Math.random(),
                Math.random()-.5
            ).normalize();

        particle(
            p,
            Math.random()>.5?
                0xff4400:
                0xffdd00,
            dir
        );

    }


    const d=
        player.position.distanceTo(
            bot.position
        );

    if(d<=6){

        botHP-=60;

        damageText(
            bot.position,
            "-60 🔥"
        );

        updateHP();

        if(botHP<=0){
            win();
        }

    }

}


// ==================================================
// AURA
// ==================================================

function aura(pos,color,size){

    const ring=new THREE.Mesh(

        new THREE.TorusGeometry(
            size,
            .08,
            12,
            64
        ),

        new THREE.MeshBasicMaterial({
            color:color,
            transparent:true,
            opacity:1
        })

    );

    ring.position.copy(pos);
    ring.position.y=.15;

    ring.rotation.x=Math.PI/2;

    scene.add(ring);

    effects.push({
        obj:ring,
        life:1,
        type:"ring"
    });


    // vertical aura

    const ring2=ring.clone();

    ring2.rotation.x=0;

    ring2.position.y=1.5;

    scene.add(ring2);

    effects.push({
        obj:ring2,
        life:1,
        type:"ring2"
    });

}


// ==================================================
// SHOCKWAVE
// ==================================================

function shockwave(pos,color,max=3){

    const geo=
        new THREE.RingGeometry(
            .2,.5,64
        );

    const mesh=
        new THREE.Mesh(
            geo,
            new THREE.MeshBasicMaterial({
                color:color,
                transparent:true,
                opacity:1,
                side:THREE.DoubleSide
            })
        );

    mesh.rotation.x=-Math.PI/2;

    mesh.position.copy(pos);
    mesh.position.y=.1;

    scene.add(mesh);

    effects.push({
        obj:mesh,
        life:1,
        shock:true,
        max
    });

}


// ==================================================
// SLASH EFFECT
// ==================================================

function slashEffect(pos,color){

    const ring=new THREE.Mesh(
        new THREE.TorusGeometry(
            1.2,.12,10,32,
            Math.PI
        ),
        new THREE.MeshBasicMaterial({
            color:color,
            transparent:true
        })
    );

    ring.position.copy(pos);
    ring.position.y=1.5;

    ring.rotation.y=
        Math.random()*Math.PI;

    scene.add(ring);

    effects.push({
        obj:ring,
        life:.35,
        slash:true
    });

}


// ==================================================
// HIT EFFECT
// ==================================================

function hitEffect(pos,color,size){

    aura(
        pos,
        color,
        size
    );

}


// ==================================================
// PARTICLE
// ==================================================

function particle(pos,color,dir){

    const mesh=new THREE.Mesh(
        new THREE.SphereGeometry(
            .08,
            6,
            6
        ),
        new THREE.MeshBasicMaterial({
            color:color
        })
    );

    mesh.position.copy(pos);

    scene.add(mesh);

    effects.push({
        obj:mesh,
        life:1,
        particle:true,
        dir:dir
    });

}


// ==================================================
// DAMAGE TEXT
// ==================================================

function damageText(pos,text){

    const div=
        document.createElement("div");

    div.style.position="fixed";
    div.style.color="white";
    div.style.fontSize="28px";
    div.style.fontWeight="bold";
    div.style.textShadow="3px 3px #000";
    div.innerText=text;

    document.body.appendChild(div);

    let life=1;

    function anim(){

        life-=.025;

        const v=
            pos.clone();

        v.y+=2+(1-life)*2;

        v.project(camera);

        div.style.left=
            ((v.x+1)/2*innerWidth)+"px";

        div.style.top=
            ((-v.y+1)/2*innerHeight)+"px";

        div.style.opacity=life;

        if(life>0){
            requestAnimationFrame(anim);
        }else{
            div.remove();
        }

    }

    anim();

}


// ==================================================
// COOLDOWN
// ==================================================

function cooldownDisplay(id,time){

    const el=
        document.getElementById(id);

    let t=time;

    el.innerText=t.toFixed(1);

    const timer=setInterval(()=>{

        t-=.1;

        if(t<=0){

            clearInterval(timer);

            el.innerText="READY";

        }else{

            el.innerText=t.toFixed(1);

        }

    },100);

}


// ==================================================
// HP
// ==================================================

function updateHP(){

    document.getElementById("bothp")
        .style.width=
        Math.max(0,botHP)+"%";

}


// ==================================================
// WIN
// ==================================================

function win(){

    if(!running)return;

    running=false;

    coins+=25;

    document.getElementById(
        "coinText"
    ).innerText=coins;

    document.getElementById(
        "result"
    ).innerText="🏆 YOU WIN!";

    document.getElementById(
        "reward"
    ).innerText="+25 🪙";

    document.getElementById(
        "win"
    ).style.display="flex";

}


// ==================================================
// LOSE
// ==================================================

function lose(){

    if(!running)return;

    running=false;

    document.getElementById(
        "result"
    ).innerText="💀 YOU LOST!";

    document.getElementById(
        "reward"
    ).innerText="Try again!";

    document.getElementById(
        "win"
    ).style.display="flex";

}


// ==================================================
// NEW ROUND
// ==================================================

function newRound(){

    document.getElementById(
        "win"
    ).style.display="none";

    playerHP=100;
    botHP=100;

    qCooldown=0;
    eCooldown=0;
    rCooldown=0;

    player.position.set(-3,0,0);
    bot.position.set(3,0,0);

    document.getElementById("myhp")
        .style.width="100%";

    document.getElementById("bothp")
        .style.width="100%";

    document.getElementById("qcd")
        .innerText="READY";

    document.getElementById("ecd")
        .innerText="READY";

    document.getElementById("rcd")
        .innerText="READY";

    running=true;
}


// ==================================================
// EFFECT UPDATE
// ==================================================

function updateEffects(dt){

    for(let i=effects.length-1;i>=0;i--){

        const e=effects[i];

        e.life-=dt*2;

        if(e.particle){

            e.obj.position.add(
                e.dir.clone().multiplyScalar(dt*5)
            );

        }

        if(e.shock){

            const scale=
                1+(1-e.life)*e.max;

            e.obj.scale.set(
                scale,
                scale,
                scale
            );

            e.obj.material.opacity=
                Math.max(0,e.life);

        }

        if(e.ring){

            e.obj.rotation.z+=dt*5;

            e.obj.scale.multiplyScalar(
                1+dt*2
            );

            e.obj.material.opacity=
                Math.max(0,e.life);

        }

        if(e.slash){

            e.obj.rotation.z+=dt*10;

            e.obj.material.opacity=
                Math.max(0,e.life);
        }

        if(e.life<=0){

            scene.remove(e.obj);

            effects.splice(i,1);
        }

    }

}


// ==================================================
// GAME LOOP
// ==================================================

function animate(){

    requestAnimationFrame(animate);

    const dt=Math.min(
        clock.getDelta(),
        .05
    );


    if(running){

        movement(dt);


        playerVelocityY-=
            1.3*dt;

        player.position.y+=
            playerVelocityY;

        if(player.position.y<0){

            player.position.y=0;
            playerVelocityY=0;
        }


        botAI(dt);
    }


    updateEffects(dt);


    // CAMERA

    if(player){

        const distance=7;

        const cx=
            player.position.x+
            Math.sin(yaw)*distance;

        const cz=
            player.position.z+
            Math.cos(yaw)*distance;

        const cy=
            player.position.y+
            3+
            Math.sin(pitch)*4;

        camera.position.lerp(
            new THREE.Vector3(
                cx,cy,cz
            ),
            .12
        );

        camera.lookAt(
            player.position.x,
            player.position.y+1.2,
            player.position.z
        );

    }


    renderer.render(
        scene,
        camera
    );

}


// ==================================================
// RESIZE
// ==================================================

window.onresize=()=>{

    if(!camera)return;

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

};

</script>
