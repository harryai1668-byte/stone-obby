<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Stone Obby</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
    background:#87ceeb;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    top:12px;
    left:12px;
    z-index:10;

    padding:10px 14px;

    color:white;
    background:rgba(0,0,0,.65);

    border-radius:12px;

    font-size:17px;
    line-height:1.45;

    user-select:none;
}

#help{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);

    z-index:10;

    color:white;
    background:rgba(0,0,0,.6);

    padding:8px 13px;
    border-radius:10px;

    font-size:13px;
}

#mobileControls{
    display:none;

    position:fixed;
    inset:0;

    z-index:15;

    pointer-events:none;
}

/* JOYSTICK */

#joystick{
    position:absolute;

    left:25px;
    bottom:30px;

    width:125px;
    height:125px;

    border-radius:50%;

    background:rgba(255,255,255,.20);

    border:2px solid rgba(255,255,255,.4);

    pointer-events:auto;
}

#stick{
    position:absolute;

    width:55px;
    height:55px;

    left:33px;
    top:33px;

    border-radius:50%;

    background:rgba(255,255,255,.65);
}


/* JUMP */

#jump{
    position:absolute;

    right:30px;
    bottom:45px;

    width:90px;
    height:90px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.5);

    background:rgba(50,150,255,.65);

    color:white;

    font-size:18px;
    font-weight:bold;

    pointer-events:auto;

    user-select:none;
}

#win{
    display:none;

    position:fixed;
    inset:0;

    z-index:30;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:rgba(0,0,0,.72);

    color:white;
}

#win h1{
    font-size:48px;
    margin:0 0 20px;
}

#win button{
    border:0;
    border-radius:10px;

    padding:12px 24px;

    font-size:20px;
}


/* MOBILE */

@media (max-width:800px){

    #mobileControls{
        display:block;
    }

    #help{
        display:none;
    }

}

</style>
</head>

<body>

<div id="ui">
🪨 <b>STONE OBBY</b><br>
💀 Chết: <span id="deaths">0</span><br>
🚩 Stage: <span id="stage">1</span>
</div>

<div id="help">
W A S D = Di chuyển &nbsp; | &nbsp; SPACE = Nhảy
</div>


<!-- MOBILE -->

<div id="mobileControls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="jump">
        JUMP
    </button>

</div>


<!-- WIN -->

<div id="win">

    <h1>🏆 YOU WIN!</h1>

    <button onclick="location.reload()">
        Chơi lại
    </button>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


// =================================================
// SCENE
// =================================================

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

scene.fog =
new THREE.Fog(
    0x87ceeb,
    35,
    180
);


// =================================================
// CAMERA
// =================================================

const camera =
new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    .1,
    500
);


// =================================================
// RENDERER
// =================================================

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);


// =================================================
// LIGHT
// =================================================

const sun =
new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    30,
    50,
    20
);

sun.castShadow=true;

scene.add(sun);


scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        1.5
    )
);


// =================================================
// MATERIALS
// =================================================

const stone =
new THREE.MeshStandardMaterial({
    color:0x777777,
    roughness:1
});

const grass =
new THREE.MeshStandardMaterial({
    color:0x4f963f,
    roughness:1
});

const skin =
new THREE.MeshStandardMaterial({
    color:0xffc28b
});

const shirt =
new THREE.MeshStandardMaterial({
    color:0x2879ff
});


// =================================================
// PLATFORMS
// =================================================

const platforms=[];


function makePlatform(
    x,
    y,
    z,
    width,
    depth
){

    const rock =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            1,
            depth
        ),
        stone
    );

    rock.position.set(
        x,y,z
    );

    rock.castShadow=true;
    rock.receiveShadow=true;

    scene.add(rock);

    platforms.push(rock);


    const top =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width+.1,
            .22,
            depth+.1
        ),
        grass
    );

    top.position.set(
        x,
        y+.61,
        z
    );

    scene.add(top);
}


// =================================================
// MAP
// =================================================

makePlatform(
    0,0,0,
    10,10
);

makePlatform(
    0,1.5,-8,
    5,5
);

makePlatform(
    4,3,-15,
    5,5
);

makePlatform(
    -2,4.5,-22,
    5,5
);

makePlatform(
    -7,6,-29,
    5,5
);

makePlatform(
    0,7.5,-36,
    6,6
);

makePlatform(
    7,9,-43,
    5,5
);

makePlatform(
    3,10.5,-50,
    5,5
);

makePlatform(
    -5,12,-57,
    6,6
);

makePlatform(
    -10,13.5,-65,
    6,6
);

makePlatform(
    -3,15,-73,
    7,7
);


// FINISH

makePlatform(
    5,16.5,-83,
    10,10
);


// =================================================
// FINISH FLAG
// =================================================

const pole =
new THREE.Mesh(
    new THREE.CylinderGeometry(
        .15,.15,6
    ),
    new THREE.MeshStandardMaterial({
        color:0x70452b
    })
);

pole.position.set(
    5,20,-83
);

scene.add(pole);


const flag =
new THREE.Mesh(
    new THREE.BoxGeometry(
        3,1.5,.1
    ),
    new THREE.MeshStandardMaterial({
        color:0xff3333
    })
);

flag.position.set(
    6.4,21.5,-83
);

scene.add(flag);


// =================================================
// PLAYER
// =================================================

const player =
new THREE.Group();


// BODY

const body =
new THREE.Mesh(
    new THREE.BoxGeometry(
        1.2,1.8,.7
    ),
    shirt
);

body.position.y=1;

body.castShadow=true;

player.add(body);


// HEAD

const head =
new THREE.Mesh(
    new THREE.BoxGeometry(
        1,1,1
    ),
    skin
);

head.position.y=2.4;

head.castShadow=true;

player.add(head);


// SPAWN

const spawn =
new THREE.Vector3(
    0,.75,0
);

player.position.copy(
    spawn
);

scene.add(player);


// =================================================
// PHYSICS
// =================================================

let velocityY=0;

const gravity=-.045;

const jumpPower=.9;

let grounded=false;


// =================================================
// KEYBOARD
// =================================================

const keys={
    w:false,
    a:false,
    s:false,
    d:false
};


window.addEventListener(
    "keydown",
    e=>{

        const k=
        e.key.toLowerCase();

        if(
            k==="w" ||
            k==="a" ||
            k==="s" ||
            k==="d"
        ){

            keys[k]=true;

            e.preventDefault();
        }

        if(
            e.code==="Space"
        ){

            e.preventDefault();

            jump();
        }
    }
);


window.addEventListener(
    "keyup",
    e=>{

        const k=
        e.key.toLowerCase();

        if(
            k==="w" ||
            k==="a" ||
            k==="s" ||
            k==="d"
        ){

            keys[k]=false;
        }
    }
);


// =================================================
// JUMP
// =================================================

function jump(){

    if(grounded){

        velocityY=
        jumpPower;

        grounded=false;
    }
}


// =================================================
// MOBILE JOYSTICK
// =================================================

const joystick =
document.getElementById(
    "joystick"
);

const stick =
document.getElementById(
    "stick"
);

let joystickActive=false;

let joystickX=0;

let joystickY=0;


function joystickMove(
    clientX,
    clientY
){

    const rect =
    joystick.getBoundingClientRect();

    const centerX =
    rect.left +
    rect.width/2;

    const centerY =
    rect.top +
    rect.height/2;


    let dx =
    clientX-centerX;

    let dy =
    clientY-centerY;


    const max=45;

    const distance =
    Math.sqrt(
        dx*dx+dy*dy
    );


    if(distance>max){

        dx=
        dx/distance*max;

        dy=
        dy/distance*max;
    }


    joystickX =
    dx/max;

    joystickY =
    dy/max;


    stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}


joystick.addEventListener(
    "touchstart",
    e=>{

        joystickActive=true;

        joystickMove(
            e.touches[0].clientX,
            e.touches[0].clientY
        );
    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        if(!joystickActive)
            return;

        e.preventDefault();

        joystickMove(
            e.touches[0].clientX,
            e.touches[0].clientY
        );
    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    ()=>{

        joystickActive=false;

        joystickX=0;
        joystickY=0;

        stick.style.transform=
        "translate(0,0)";
    }
);


// =================================================
// MOBILE JUMP
// =================================================

const jumpButton =
document.getElementById(
    "jump"
);


jumpButton.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        jump();
    },
    {passive:false}
);


// =================================================
// RESPAWN
// =================================================

let deaths=0;


function respawn(){

    deaths++;

    document.getElementById(
        "deaths"
    ).textContent=
    deaths;


    player.position.copy(
        spawn
    );

    velocityY=0;

    joystickX=0;
    joystickY=0;
}


// =================================================
// COLLISION
// =================================================

function collision(){

    grounded=false;


    for(
        const p of platforms
    ){

        const box =
        new THREE.Box3()
        .setFromObject(p);


        const x=
        player.position.x;

        const z=
        player.position.z;

        const y=
        player.position.y;


        const insideX=
        x>box.min.x-.6 &&
        x<box.max.x+.6;


        const insideZ=
        z>box.min.z-.6 &&
        z<box.max.z+.6;


        if(
            insideX &&
            insideZ &&
            y>=box.max.y-.4 &&
            y<=box.max.y+.8 &&
            velocityY<=0
        ){

            player.position.y=
            box.max.y;

            velocityY=0;

            grounded=true;

            break;
        }
    }
}


// =================================================
// PLAYER UPDATE
// =================================================

function updatePlayer(){

    const speed=.18;


    // PC

    let moveX=0;
    let moveZ=0;


    if(keys.a)
        moveX-=1;

    if(keys.d)
        moveX+=1;

    if(keys.w)
        moveZ-=1;

    if(keys.s)
        moveZ+=1;


    // MOBILE

    if(
        Math.abs(joystickX)>.05 ||
        Math.abs(joystickY)>.05
    ){

        moveX=
        joystickX;

        moveZ=
        joystickY;
    }


    // DI CHUYỂN

    player.position.x +=
    moveX*speed;

    player.position.z +=
    moveZ*speed;


    // GRAVITY

    velocityY+=gravity;

    player.position.y+=
    velocityY;


    collision();


    // FALL

    if(
        player.position.y < -12
    ){

        respawn();
    }


    // FINISH

    if(
        player.position.z < -78 &&
        player.position.y > 15
    ){

        document.getElementById(
            "win"
        ).style.display=
        "flex";
    }
}


// =================================================
// CAMERA
// =================================================

function updateCamera(){

    const targetX=
    player.position.x;

    const targetY=
    player.position.y+5;

    const targetZ=
    player.position.z+10;


    camera.position.x +=
    (
        targetX-
        camera.position.x
    )*.1;


    camera.position.y +=
    (
        targetY-
        camera.position.y
    )*.1;


    camera.position.z +=
    (
        targetZ-
        camera.position.z
    )*.1;


    camera.lookAt(
        player.position.x,
        player.position.y+1,
        player.position.z-3
    );
}


// =================================================
// RESIZE
// =================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        innerWidth/
        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


// =================================================
// START
// =================================================

camera.position.set(
    0,6,11
);


function animate(){

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
