<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stone Obby</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
}

canvas {
    display: block;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;

    padding: 14px 18px;

    background: rgba(20, 30, 40, 0.8);
    color: white;

    border-radius: 12px;

    font-size: 18px;
    line-height: 1.5;

    user-select: none;
}

#help {
    position: fixed;
    bottom: 15px;
    left: 15px;

    z-index: 10;

    background: rgba(20,30,40,.75);
    color: white;

    padding: 10px 14px;
    border-radius: 10px;

    font-size: 14px;
}

#win {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 20;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: rgba(0,0,0,.7);

    color: white;
}

#win h1 {
    font-size: 55px;
    margin: 0 0 20px;
}

#win button {
    border: none;
    border-radius: 10px;

    padding: 12px 25px;

    font-size: 20px;

    cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
    🪨 <b>STONE OBBY</b><br>
    💀 Chết: <span id="deaths">0</span><br>
    🚩 Stage: <span id="stage">1</span>
</div>

<div id="help">
    W A S D = Di chuyển &nbsp; | &nbsp; SPACE = Nhảy
</div>

<div id="win">
    <h1>🏆 YOU WIN!</h1>
    <button onclick="location.reload()">Chơi lại</button>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


// ==================================================
// SCENE
// ==================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        40,
        180
    );


// ==================================================
// CAMERA
// ==================================================

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.1,
        500
    );

camera.position.set(
    0,
    7,
    13
);


// ==================================================
// RENDERER
// ==================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


// ==================================================
// LIGHT
// ==================================================

const sunlight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sunlight.position.set(
    30,
    50,
    20
);

sunlight.castShadow = true;

scene.add(sunlight);


const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x668866,
        1.5
    );

scene.add(ambient);


// ==================================================
// MATERIALS
// ==================================================

const grassMat =
    new THREE.MeshStandardMaterial({
        color: 0x4f9b45,
        roughness: 1
    });

const stoneMat =
    new THREE.MeshStandardMaterial({
        color: 0x777777,
        roughness: 1
    });

const dirtMat =
    new THREE.MeshStandardMaterial({
        color: 0x70452b,
        roughness: 1
    });

const woodMat =
    new THREE.MeshStandardMaterial({
        color: 0x8b5a2b,
        roughness: 1
    });


// ==================================================
// PLATFORMS
// ==================================================

const platforms = [];

function makePlatform(
    x,
    y,
    z,
    width,
    depth
) {

    // Đất

    const dirt =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                1.2,
                depth
            ),
            stoneMat
        );

    dirt.position.set(
        x,
        y,
        z
    );

    dirt.castShadow = true;
    dirt.receiveShadow = true;

    scene.add(dirt);

    platforms.push(dirt);


    // Cỏ trên mặt

    const grass =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width + 0.05,
                0.25,
                depth + 0.05
            ),
            grassMat
        );

    grass.position.set(
        x,
        y + 0.72,
        z
    );

    grass.receiveShadow = true;

    scene.add(grass);


    return dirt;
}


// ==================================================
// MAP
// ==================================================

// Spawn

makePlatform(
    0,
    0,
    0,
    10,
    10
);


// Các bậc đá

makePlatform(
    0,
    1.5,
    -8,
    5,
    5
);

makePlatform(
    4,
    3,
    -15,
    5,
    5
);

makePlatform(
    -2,
    4.5,
    -22,
    5,
    5
);

makePlatform(
    -7,
    6,
    -29,
    5,
    5
);

makePlatform(
    0,
    7.5,
    -36,
    6,
    6
);

makePlatform(
    7,
    9,
    -43,
    5,
    5
);

makePlatform(
    3,
    10.5,
    -50,
    5,
    5
);

makePlatform(
    -5,
    12,
    -57,
    6,
    6
);

makePlatform(
    -10,
    13.5,
    -65,
    6,
    6
);

makePlatform(
    -3,
    15,
    -73,
    7,
    7
);


// ==================================================
// FINISH
// ==================================================

makePlatform(
    5,
    16.5,
    -83,
    10,
    10
);


// ==================================================
// FINISH FLAG
// ==================================================

const pole =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.15,
            0.15,
            6
        ),
        woodMat
    );

pole.position.set(
    5,
    20,
    -83
);

pole.castShadow = true;

scene.add(pole);


const flag =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            3,
            1.6,
            0.1
        ),
        new THREE.MeshStandardMaterial({
            color: 0xff3333
        })
    );

flag.position.set(
    6.4,
    21.5,
    -83
);

scene.add(flag);


// ==================================================
// PLAYER
// ==================================================

const player =
    new THREE.Group();


// Body

const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.2,
            1.8,
            0.7
        ),
        new THREE.MeshStandardMaterial({
            color: 0x3366ff
        })
    );

body.position.y = 1;

body.castShadow = true;

player.add(body);


// Head

const head =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1,
            1,
            1
        ),
        new THREE.MeshStandardMaterial({
            color: 0xffc28b
        })
    );

head.position.y = 2.4;

head.castShadow = true;

player.add(head);


// Mắt

const eyeMat =
    new THREE.MeshBasicMaterial({
        color: 0x111111
    });

const eye1 =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.12,
            0.12,
            0.05
        ),
        eyeMat
    );

eye1.position.set(
    -0.2,
    2.5,
    -0.48
);

player.add(eye1);


const eye2 =
    eye1.clone();

eye2.position.x = 0.2;

player.add(eye2);


// Spawn

const spawn =
    new THREE.Vector3(
        0,
        0.75,
        0
    );

player.position.copy(
    spawn
);

scene.add(player);


// ==================================================
// PHYSICS
// ==================================================

let velocityY = 0;

const gravity = -0.045;

const jumpPower = 0.9;

let grounded = false;


// ==================================================
// CONTROLS
// ==================================================

const keys = {};

window.addEventListener(
    "keydown",
    function(e) {

        keys[e.key.toLowerCase()] =
            true;

        if (
            e.code === "Space" &&
            grounded
        ) {

            velocityY =
                jumpPower;

            grounded = false;
        }
    }
);


window.addEventListener(
    "keyup",
    function(e) {

        keys[e.key.toLowerCase()] =
            false;
    }
);


// ==================================================
// DEATH
// ==================================================

let deaths = 0;

function respawn() {

    deaths++;

    document.getElementById(
        "deaths"
    ).textContent = deaths;

    player.position.copy(
        spawn
    );

    velocityY = 0;
}


// ==================================================
// COLLISION
// ==================================================

function collision() {

    grounded = false;

    const playerX =
        player.position.x;

    const playerZ =
        player.position.z;

    const playerY =
        player.position.y;


    for (
        const platform of platforms
    ) {

        const box =
            new THREE.Box3()
                .setFromObject(
                    platform
                );


        const insideX =
            playerX >
                box.min.x - 0.6 &&
            playerX <
                box.max.x + 0.6;


        const insideZ =
            playerZ >
                box.min.z - 0.6 &&
            playerZ <
                box.max.z + 0.6;


        const platformTop =
            box.max.y;


        if (
            insideX &&
            insideZ &&
            playerY >=
                platformTop - 0.4 &&
            playerY <=
                platformTop + 0.7 &&
            velocityY <= 0
        ) {

            player.position.y =
                platformTop;

            velocityY = 0;

            grounded = true;

            break;
        }
    }
}


// ==================================================
// PLAYER UPDATE
// ==================================================

function updatePlayer() {

    const speed = 0.18;


    if (keys["w"]) {
        player.position.z -= speed;
    }

    if (keys["s"]) {
        player.position.z += speed;
    }

    if (keys["a"]) {
        player.position.x -= speed;
    }

    if (keys["d"]) {
        player.position.x += speed;
    }


    // Gravity

    velocityY += gravity;

    player.position.y +=
        velocityY;


    // Collision

    collision();


    // Rơi khỏi map

    if (
        player.position.y < -12
    ) {

        respawn();
    }


    // Finish

    if (
        player.position.z < -78 &&
        player.position.y > 15
    ) {

        document.getElementById(
            "win"
        ).style.display = "flex";
    }
}


// ==================================================
// CAMERA
// ==================================================

function updateCamera() {

    const targetX =
        player.position.x;

    const targetY =
        player.position.y + 6;

    const targetZ =
        player.position.z + 11;


    camera.position.x +=
        (targetX -
        camera.position.x) * 0.08;

    camera.position.y +=
        (targetY -
        camera.position.y) * 0.08;

    camera.position.z +=
        (targetZ -
        camera.position.z) * 0.08;


    camera.lookAt(
        player.position.x,
        player.position.y + 1,
        player.position.z - 4
    );
}


// ==================================================
// RESIZE
// ==================================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


// ==================================================
// GAME LOOP
// ==================================================

function gameLoop() {

    requestAnimationFrame(
        gameLoop
    );

    updatePlayer();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

gameLoop();

</script>

</body>
</html>
