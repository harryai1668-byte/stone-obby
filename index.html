<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stone Obby</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#title{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;font-size:28px;font-weight:900;text-shadow:0 2px 5px #000;text-align:center;pointer-events:none}
#hint{position:fixed;top:55px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;text-shadow:0 2px 4px #000;font-size:14px;white-space:nowrap;pointer-events:none}
#joy{display:none;position:fixed;left:25px;bottom:28px;width:120px;height:120px;border:3px solid #fff;border-radius:50%;background:#ffffff33;z-index:10;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#ffffffaa}
#jump{display:none;position:fixed;right:25px;bottom:28px;width:90px;height:90px;border:3px solid #fff;border-radius:50%;background:#ffffff44;color:#fff;font-weight:900;z-index:10;pointer-events:auto}
#win{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;color:#fff;text-align:center}
#winbox{background:#222;padding:28px;border-radius:18px}
#winbox button{padding:12px 22px;border:0;border-radius:10px;font-weight:bold}
@media(max-width:800px){#joy,#jump{display:block}#title{font-size:23px}#hint{font-size:12px}}
</style>
</head>
<body>
<div id="title">🥓 STONE OBBY</div>
<div id="hint">WASD để di chuyển • SPACE để nhảy</div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">JUMP</button>
<div id="win"><div id="winbox"><h1>🏆 YOU WIN!</h1><p>Bro đã hoàn thành Obby 😎</p><button onclick="location.reload()">Chơi lại</button></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>


<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,45,220);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x668866,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(25,40,25);
sun.castShadow=true;
scene.add(sun);

const platforms=[];
function addPlatform(x,y,z,w,h,d){
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color:0x777777,roughness:.9})
  );
  body.position.set(x,y,z);
  body.castShadow=true;
  body.receiveShadow=true;
  scene.add(body);

  const grass=new THREE.Mesh(
    new THREE.BoxGeometry(Math.max(.1,w-.12),.12,Math.max(.1,d-.12)),
    new THREE.MeshStandardMaterial({color:0x5f9e45,roughness:1})
  );
  grass.position.set(x,y+h/2+.06,z);
  grass.receiveShadow=true;
  scene.add(grass);

  platforms.push({x,y,z,w,h,d,mesh:body});
}

addPlatform(0,-1,0,14,2,14);
addPlatform(0,0,-10,9,1.5,7);
addPlatform(5,1,-20,7,1.5,7);
addPlatform(-2,2,-30,7,1.5,7);
addPlatform(6,3,-40,7,1.5,7);
addPlatform(0,4,-50,8,1.5,7);
addPlatform(-7,5,-60,7,1.5,7);
addPlatform(0,6,-70,9,1.5,8);
addPlatform(7,7,-81,7,1.5,7);
addPlatform(0,8,-92,12,1.5,10);

const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.08,.08,4,12),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
pole.position.set(0,10,-92);
scene.add(pole);

const flag=new THREE.Mesh(
  new THREE.PlaneGeometry(2.2,1.2),
  new THREE.MeshStandardMaterial({color:0xff3333,side:THREE.DoubleSide})
);
flag.position.set(1.05,11,-92);
scene.add(flag);

const player=new THREE.Group();
scene.add(player);

const spawn=new THREE.Vector3(0,0,3);
player.position.copy(spawn);

// Character collider: deliberately close to a normal Roblox avatar footprint.
const R=.42;
const H=2.05;
const SPEED=7.0;
const GRAVITY=20;
const JUMP=7.6;

let vy=0;
let grounded=true;
let moving=false;
let finished=false;

let bacon=null;
let mixer=null;
let runAction=null;
let baconBasePos=new THREE.Vector3();
let baconBaseRot=new THREE.Euler(0,0,0);

function putBaconOnFeet(model){
  // Center model on player root first.
  model.position.set(0,0,0);
  model.rotation.set(0,0,0);
  model.updateMatrixWorld(true);

  // Use the actual rendered bounds after scale so the feet touch the
  // player's foot plane, regardless of the glTF's internal origin.
  const box=new THREE.Box3().setFromObject(model);
  const lift=-box.min.y+0.025;
  model.position.y=lift;
  model.updateMatrixWorld(true);

  baconBasePos.set(0,lift,0);
  baconBaseRot.set(0,0,0);
  model.position.copy(baconBasePos);
  model.rotation.set(0,0,0);
}

const loader=new GLTFLoader();
loader.load("./scene.gltf?v=complete-final-1",gltf=>{
  const model=gltf.scene;
  bacon=model;

  // The supplied glTF has a very small native scale; this gives a
  // normal Roblox-like avatar height without the giant model problem.
  model.scale.setScalar(36);

  let texture=null;
  try{
    texture=gltf.parser.getDependency("texture",0);
    if(texture && texture.then){
      texture.then(t=>{
        if(!t)return;
        t.colorSpace=THREE.SRGBColorSpace;
        t.flipY=false;
        t.needsUpdate=true;
        model.traverse(o=>{
          if(!o.isMesh)return;
          o.material=new THREE.MeshStandardMaterial({
            map:t,
            roughness:.85,
            metalness:0
          });
        });
      });
    }
  }catch(e){}

  model.traverse(o=>{
    if(!o.isMesh)return;
    o.visible=true;
    o.castShadow=true;
    o.receiveShadow=true;
  });

  putBaconOnFeet(model);
  player.add(model);

  if(gltf.animations && gltf.animations.length){
    const clip=gltf.animations[0];

    // Remove only root/hips POSITION tracks. This stops Mixamo root-motion
    // from physically moving the avatar away from the player collider.
    const tracks=clip.tracks.filter(t=>{
      const n=t.name.toLowerCase();
      return !(n.endsWith(".position") &&
        (n.includes("hips")||n.includes("pelvis")||n.includes("root")));
    });

    const stable=new THREE.AnimationClip(clip.name,clip.duration,tracks);
    mixer=new THREE.AnimationMixer(model);
    runAction=mixer.clipAction(stable);
    runAction.setLoop(THREE.LoopRepeat,Infinity);
    runAction.play();
    runAction.paused=true;
  }

  console.log("🥓 Bacon loaded — centered, feet aligned, root motion removed");
},undefined,e=>{
  console.error("Bacon load failed:",e);
});

// ---------- INPUT ----------
const keys=Object.create(null);
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Space")e.preventDefault();
});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));

let joyX=0,joyY=0,joyOn=false;
const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

function joyMove(e){
  const r=joy.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let x=e.clientX-cx, y=e.clientY-cy;
  const max=48, len=Math.hypot(x,y);
  if(len>max){x=x/len*max;y=y/len*max}
  joyX=x/max;
  joyY=y/max;
  knob.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener("pointerdown",e=>{
  e.preventDefault();
  joyOn=true;
  joy.setPointerCapture(e.pointerId);
  joyMove(e);
});
joy.addEventListener("pointermove",e=>{if(joyOn)joyMove(e)});
function resetJoy(){
  joyOn=false;
  joyX=0;joyY=0;
  knob.style.transform="translate(0,0)";
}
joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);

let jumpPressed=false;
document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();
  jumpPressed=true;
});

// ---------- COLLISION ----------
function insideXZ(p,x,z,margin=0){
  return x>=p.x-p.w/2+margin &&
         x<=p.x+p.w/2-margin &&
         z>=p.z-p.d/2+margin &&
         z<=p.z+p.d/2-margin;
}

function getStandingPlatform(){
  let best=null;
  for(const p of platforms){
    const top=p.y+p.h/2;
    if(insideXZ(p,player.position.x,player.position.z,R*.85) &&
       Math.abs(player.position.y-top)<.06){
      if(!best || top>best.y+best.h/2)best=p;
    }
  }
  return best;
}

function moveHorizontal(dx,dz){
  // X sweep against platform side walls.
  if(dx!==0){
    let target=player.position.x+dx;
    for(const p of platforms){
      const top=p.y+p.h/2, bottom=p.y-p.h/2;
      const feet=player.position.y, head=feet+H;

      if(head<=bottom || feet>=top)continue;
      if(Math.abs(player.position.z-p.z)>p.d/2+R)continue;

      const left=p.x-p.w/2-R;
      const right=p.x+p.w/2+R;

      if(target>left && target<right){
        target=dx>0?left:right;
      }
    }
    player.position.x=target;
  }

  // Z sweep against platform side walls.
  if(dz!==0){
    let target=player.position.z+dz;
    for(const p of platforms){
      const top=p.y+p.h/2, bottom=p.y-p.h/2;
      const feet=player.position.y, head=feet+H;

      if(head<=bottom || feet>=top)continue;
      if(Math.abs(player.position.x-p.x)>p.w/2+R)continue;

      const front=p.z-p.d/2-R;
      const back=p.z+p.d/2+R;

      if(target>front && target<back){
        target=dz>0?front:back;
      }
    }
    player.position.z=target;
  }
}

function verticalMove(dt){
  const oldY=player.position.y;
  const oldVy=vy;

  vy-=GRAVITY*dt;
  let newY=oldY+vy*dt;
  grounded=false;

  // Falling: detect every platform whose top is crossed this frame.
  if(oldVy<=0){
    let landing=null;

    for(const p of platforms){
      if(!insideXZ(p,player.position.x,player.position.z,R*.85))continue;

      const top=p.y+p.h/2;
      if(oldY>=top && newY<=top){
        if(!landing || top>landing.y+landing.h/2)landing=p;
      }
    }

    if(landing){
      newY=landing.y+landing.h/2;
      vy=0;
      grounded=true;
    }
  }

  // Rising: stop the head at the underside of a platform.
  if(oldVy>0){
    const oldHead=oldY+H;
    const newHead=newY+H;
    let ceiling=null;

    for(const p of platforms){
      if(!insideXZ(p,player.position.x,player.position.z,R*.85))continue;

      const bottom=p.y-p.h/2;
      if(oldHead<=bottom && newHead>=bottom){
        if(!ceiling || bottom<ceiling.y-ceiling.h/2)ceiling=p;
      }
    }

    if(ceiling){
      newY=ceiling.y-ceiling.h/2-H;
      vy=0;
    }
  }

  player.position.y=newY;

  const standing=getStandingPlatform();
  if(standing && vy<=0){
    player.position.y=standing.y+standing.h/2;
    vy=0;
    grounded=true;
  }
}

function update(dt){
  if(finished)return;

  let x=0,z=0;
  if(keys.KeyA)x-=1;
  if(keys.KeyD)x+=1;
  if(keys.KeyW)z-=1;
  if(keys.KeyS)z+=1;
  if(joyOn){x=joyX;z=joyY}

  const l=Math.hypot(x,z);
  if(l>1){x/=l;z/=l}
  moving=Math.hypot(x,z)>.08;

  moveHorizontal(x*SPEED*dt,z*SPEED*dt);

  if((keys.Space||jumpPressed) && grounded){
    keys.Space=false;
    jumpPressed=false;
    vy=JUMP;
    grounded=false;
  }else{
    keys.Space=false;
    jumpPressed=false;
  }

  verticalMove(dt);

  // Animation never controls the player position.
  if(runAction)runAction.paused=!moving;
  if(mixer)mixer.update(dt);

  // Re-apply exact visual offset after animation.
  if(bacon){
    bacon.position.copy(baconBasePos);
    bacon.rotation.x=0;
    bacon.rotation.z=0;

    // The supplied Bacon rig faces -Z at rotation 0.
    // W is -Z, so this is also the Roblox-style forward direction.
    if(moving)bacon.rotation.y=Math.atan2(x,z);
    else bacon.rotation.y=0;
  }

  if(player.position.y<-15){
    player.position.copy(spawn);
    vy=0;
    grounded=true;
    if(bacon)bacon.rotation.y=0;
  }

  if(player.position.z<-88 && player.position.y>7){
    finished=true;
    document.getElementById("win").style.display="flex";
  }
}

// ---------- CAMERA ----------
const camPos=new THREE.Vector3();
function updateCamera(dt){
  camPos.set(
    player.position.x,
    player.position.y+3.2,
    player.position.z+8.5
  );

  camera.position.lerp(camPos,1-Math.pow(.001,dt));
  camera.lookAt(
    player.position.x,
    player.position.y+1.0,
    player.position.z-3.0
  );
}

const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.033);
  update(dt);
  updateCamera(dt);
  renderer.render(scene,camera);
}
loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
