<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stone Obby</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#title{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;font-size:28px;font-weight:900;text-shadow:0 2px 5px #000;text-align:center;pointer-events:none}
#hint{position:fixed;top:55px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;text-shadow:0 2px 4px #000;font-size:14px;white-space:nowrap;pointer-events:none}
#joy{display:none;position:fixed;left:25px;bottom:28px;width:120px;height:120px;border:3px solid #fff;border-radius:50%;background:#ffffff33;z-index:10;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#ffffffaa}
#jump{display:none;position:fixed;right:25px;bottom:28px;width:90px;height:90px;border:3px solid #fff;border-radius:50%;background:#ffffff44;color:#fff;font-weight:900;z-index:10;pointer-events:auto}
#win{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;color:#fff;text-align:center}
#winbox{background:#222;padding:28px;border-radius:18px}
#winbox button{padding:12px 22px;border:0;border-radius:10px;font-weight:bold}
@media(max-width:800px){#joy,#jump{display:block}#title{font-size:23px}#hint{font-size:12px}}
</style>
</head>
<body>
<div id="title">🥓 STONE OBBY</div>
<div id="hint">WASD để di chuyển • SPACE để nhảy</div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">JUMP</button>
<div id="win"><div id="winbox"><h1>🏆 YOU WIN!</h1><p>Bro đã hoàn thành Obby 😎</p><button onclick="location.reload()">Chơi lại</button></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>



<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

/* =========================
   STONE OBBY — CLEAN BUILD
   ========================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,55,260);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- LIGHT ---------- */
scene.add(new THREE.HemisphereLight(0xffffff,0x557755,2.2));

const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(25,45,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

/* ---------- MAP ---------- */
const platforms=[];

function addPlatform(x,y,z,w,h,d){
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
      color:0x707070,
      roughness:.92,
      metalness:0
    })
  );
  body.position.set(x,y,z);
  body.castShadow=true;
  body.receiveShadow=true;
  scene.add(body);

  const top=new THREE.Mesh(
    new THREE.BoxGeometry(Math.max(.05,w-.08),.12,Math.max(.05,d-.08)),
    new THREE.MeshStandardMaterial({
      color:0x62a947,
      roughness:1,
      metalness:0
    })
  );
  top.position.set(x,y+h/2+.06,z);
  top.receiveShadow=true;
  scene.add(top);

  platforms.push({x,y,z,w,h,d,body});
}

/*
  Every platform's y is its CENTER.
  Therefore its walkable top is y + h/2.
*/
addPlatform(0,-1,0,14,2,14);       // top = 0
addPlatform(0,0,-10,9,1.5,7);      // top = .75
addPlatform(5,1,-20,7,1.5,7);      // top = 1.75
addPlatform(-2,2,-30,7,1.5,7);     // top = 2.75
addPlatform(6,3,-40,7,1.5,7);      // top = 3.75
addPlatform(0,4,-50,8,1.5,7);      // top = 4.75
addPlatform(-7,5,-60,7,1.5,7);     // top = 5.75
addPlatform(0,6,-70,9,1.5,8);      // top = 6.75
addPlatform(7,7,-81,7,1.5,7);      // top = 7.75
addPlatform(0,8,-92,12,1.5,10);    // top = 8.75

/* Finish flag */
const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.08,.08,4,12),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
pole.position.set(0,10.75,-92);
scene.add(pole);

const flag=new THREE.Mesh(
  new THREE.PlaneGeometry(2.2,1.2),
  new THREE.MeshStandardMaterial({
    color:0xff4040,
    side:THREE.DoubleSide
  })
);
flag.position.set(1.05,11.7,-92);
scene.add(flag);

/* ---------- PLAYER ---------- */
const player=new THREE.Group();
scene.add(player);

const spawn=new THREE.Vector3(0,0,3);
player.position.copy(spawn);

/*
  Player root = FEET.
  This is the only object moved by physics.
  Bacon is a visual child of this root.
*/
const PLAYER_RADIUS=.42;
const PLAYER_HEIGHT=2.05;
const SPEED=7;
const GRAVITY=20;
const JUMP_SPEED=7.6;

let velocityY=0;
let grounded=true;
let moving=false;
let finished=false;

let bacon=null;
let mixer=null;
let action=null;

let baconLocalY=0;
let baconBaseYaw=0;

/* ---------- BACON ---------- */
const loader=new GLTFLoader();

loader.load("./scene.gltf?v=clean-obby-2",gltf=>{
  bacon=gltf.scene;

  /*
    First normalize the imported model to a predictable Roblox-like height.
    We do NOT hard-code scale 36.
  */
  bacon.scale.setScalar(1);
  bacon.position.set(0,0,0);
  bacon.rotation.set(0,0,0);
  bacon.updateMatrixWorld(true);

  let box=new THREE.Box3().setFromObject(bacon);
  const rawHeight=box.max.y-box.min.y;

  if(rawHeight>0){
    const desiredHeight=2.85;
    const s=desiredHeight/rawHeight;
    bacon.scale.setScalar(s);
  }

  bacon.updateMatrixWorld(true);
  box=new THREE.Box3().setFromObject(bacon);

  // Center horizontally, and put the feet exactly 0.03 above player feet.
  const centerX=(box.min.x+box.max.x)/2;
  const centerZ=(box.min.z+box.max.z)/2;

  bacon.position.x=-centerX;
  bacon.position.z=-centerZ;

  bacon.updateMatrixWorld(true);
  box=new THREE.Box3().setFromObject(bacon);

  bacon.position.y=-box.min.y+0.03;
  baconLocalY=bacon.position.y;

  /*
    The supplied model faces the opposite local direction from this game's
    -Z forward axis. Keep ONE constant correction instead of changing it
    independently in several places.
  */
  baconBaseYaw=Math.PI;
  bacon.rotation.y=baconBaseYaw;

  bacon.traverse(o=>{
    if(!o.isMesh)return;
    o.visible=true;
    o.castShadow=true;
    o.receiveShadow=true;

    // Keep the glTF's own textured material. Do not replace it.
    if(o.material){
      o.material.side=THREE.FrontSide;
    }
  });

  player.add(bacon);

  /* One supplied animation clip. Remove only root/hips translation. */
  if(gltf.animations?.length){
    const source=gltf.animations[0];

    const tracks=source.tracks.filter(track=>{
      const n=track.name.toLowerCase();

      if(!n.endsWith(".position"))return true;

      // Remove Mixamo root-motion translation only.
      return !(
        n.includes("mixamorig:hips") ||
        n.includes("mixamorig:root") ||
        n.includes("pelvis")
      );
    });

    const stable=new THREE.AnimationClip(
      source.name,
      source.duration,
      tracks
    );

    mixer=new THREE.AnimationMixer(bacon);
    action=mixer.clipAction(stable);
    action.setLoop(THREE.LoopRepeat,Infinity);
    action.play();
    action.paused=true;
  }

  console.log("🥓 BACON READY — auto-sized, feet aligned, root motion removed");
},undefined,error=>{
  console.error("❌ Bacon load failed:",error);
});

/* ---------- INPUT ---------- */
const keys=Object.create(null);

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Space")e.preventDefault();
});

addEventListener("keyup",e=>{
  keys[e.code]=false;
});

addEventListener("blur",()=>{
  for(const k in keys)delete keys[k];
  joyActive=false;
  joyX=0;
  joyY=0;
  if(knob)knob.style.transform="translate(0,0)";
});

let joyActive=false;
let joyX=0;
let joyY=0;

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

function updateJoystick(e){
  const r=joy.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let x=e.clientX-cx;
  let y=e.clientY-cy;

  const max=48;
  const len=Math.hypot(x,y);

  if(len>max){
    x=x/len*max;
    y=y/len*max;
  }

  joyX=x/max;
  joyY=y/max;
  knob.style.transform=`translate(${x}px,${y}px)`;
}

joy.addEventListener("pointerdown",e=>{
  e.preventDefault();
  joyActive=true;
  joy.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joy.addEventListener("pointermove",e=>{
  if(joyActive)updateJoystick(e);
});

function releaseJoystick(){
  joyActive=false;
  joyX=0;
  joyY=0;
  knob.style.transform="translate(0,0)";
}

joy.addEventListener("pointerup",releaseJoystick);
joy.addEventListener("pointercancel",releaseJoystick);

let jumpPressed=false;

document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();
  jumpPressed=true;
});

/* ---------- COLLISION HELPERS ---------- */

function horizontalInside(p,x,z){
  return (
    x >= p.x-p.w/2+PLAYER_RADIUS*.72 &&
    x <= p.x+p.w/2-PLAYER_RADIUS*.72 &&
    z >= p.z-p.d/2+PLAYER_RADIUS*.72 &&
    z <= p.z+p.d/2-PLAYER_RADIUS*.72
  );
}

/*
  Move in tiny substeps. This prevents tunneling through thin platform
  side walls even if a frame takes longer than normal.
*/
function moveHorizontal(dx,dz){
  const distance=Math.hypot(dx,dz);
  const steps=Math.max(1,Math.ceil(distance/.08));
  const sx=dx/steps;
  const sz=dz/steps;

  for(let i=0;i<steps;i++){
    tryMoveX(sx);
    tryMoveZ(sz);
  }
}

function verticalOverlap(p){
  const feet=player.position.y;
  const head=feet+PLAYER_HEIGHT;
  const bottom=p.y-p.h/2;
  const top=p.y+p.h/2;

  return head>bottom+.001 && feet<top-.001;
}

function tryMoveX(dx){
  if(dx===0)return;

  const target=player.position.x+dx;

  for(const p of platforms){
    if(!verticalOverlap(p))continue;

    const zClose=
      player.position.z >= p.z-p.d/2-PLAYER_RADIUS &&
      player.position.z <= p.z+p.d/2+PLAYER_RADIUS;

    if(!zClose)continue;

    const left=p.x-p.w/2-PLAYER_RADIUS;
    const right=p.x+p.w/2+PLAYER_RADIUS;

    if(target>left && target<right){
      player.position.x=dx>0?left:right;
      return;
    }
  }

  player.position.x=target;
}

function tryMoveZ(dz){
  if(dz===0)return;

  const target=player.position.z+dz;

  for(const p of platforms){
    if(!verticalOverlap(p))continue;

    const xClose=
      player.position.x >= p.x-p.w/2-PLAYER_RADIUS &&
      player.position.x <= p.x+p.w/2+PLAYER_RADIUS;

    if(!xClose)continue;

    const front=p.z-p.d/2-PLAYER_RADIUS;
    const back=p.z+p.d/2+PLAYER_RADIUS;

    if(target>front && target<back){
      player.position.z=dz>0?front:back;
      return;
    }
  }

  player.position.z=target;
}

/*
  Vertical movement is also substepped.
  We test the feet path against platform TOPS, so a fast jump cannot pass
  through a platform between two frames.
*/
function moveVertical(dt){
  const steps=Math.max(1,Math.ceil(dt/.008));
  const step=dt/steps;

  for(let i=0;i<steps;i++){
    const oldY=player.position.y;
    const oldVy=velocityY;

    velocityY-=GRAVITY*step;
    const nextY=oldY+velocityY*step;

    let landed=null;

    if(oldVy<=0){
      for(const p of platforms){
        if(!horizontalInside(p,player.position.x,player.position.z))continue;

        const top=p.y+p.h/2;

        if(oldY>=top && nextY<=top){
          if(!landed || top>landed.y+landed.h/2){
            landed=p;
          }
        }
      }
    }

    if(landed){
      player.position.y=landed.y+landed.h/2;
      velocityY=0;
      grounded=true;
      continue;
    }

    // Ceiling collision while jumping upward.
    if(oldVy>0){
      const oldHead=oldY+PLAYER_HEIGHT;
      const nextHead=nextY+PLAYER_HEIGHT;

      let ceiling=null;

      for(const p of platforms){
        if(!horizontalInside(p,player.position.x,player.position.z))continue;

        const bottom=p.y-p.h/2;

        if(oldHead<=bottom && nextHead>=bottom){
          if(!ceiling || bottom<ceiling.y-ceiling.h/2){
            ceiling=p;
          }
        }
      }

      if(ceiling){
        player.position.y=ceiling.y-ceiling.h/2-PLAYER_HEIGHT-.001;
        velocityY=0;
      }else{
        player.position.y=nextY;
      }
    }else{
      player.position.y=nextY;
    }

    // If we're standing on a platform, lock exactly to its top.
    let standing=null;

    for(const p of platforms){
      if(!horizontalInside(p,player.position.x,player.position.z))continue;

      const top=p.y+p.h/2;

      if(Math.abs(player.position.y-top)<.035 && velocityY<=0){
        if(!standing || top>standing.y+standing.h/2){
          standing=p;
        }
      }
    }

    if(standing){
      player.position.y=standing.y+standing.h/2;
      velocityY=0;
      grounded=true;
    }else{
      grounded=false;
    }
  }
}

/* ---------- CAMERA ---------- */
const desiredCamera=new THREE.Vector3();

function updateCamera(dt){
  desiredCamera.set(
    player.position.x,
    player.position.y+3.1,
    player.position.z+8.5
  );

  const follow=1-Math.pow(.0008,dt);
  camera.position.lerp(desiredCamera,follow);

  camera.lookAt(
    player.position.x,
    player.position.y+1.15,
    player.position.z-3.5
  );
}

/* ---------- GAME ---------- */
function update(dt){
  if(finished)return;

  let x=0,z=0;

  if(keys.KeyA)x-=1;
  if(keys.KeyD)x+=1;
  if(keys.KeyW)z-=1;
  if(keys.KeyS)z+=1;

  if(joyActive){
    x=joyX;
    z=joyY;
  }

  const len=Math.hypot(x,z);
  if(len>1){
    x/=len;
    z/=len;
  }

  moving=Math.hypot(x,z)>.08;

  moveHorizontal(x*SPEED*dt,z*SPEED*dt);

  if((keys.Space||jumpPressed) && grounded){
    keys.Space=false;
    jumpPressed=false;

    velocityY=JUMP_SPEED;
    grounded=false;
  }else{
    keys.Space=false;
    jumpPressed=false;
  }

  moveVertical(dt);

  /*
    Bacon is ALWAYS a child of player.
    Animation can move bones, but never the player root.
  */
  if(bacon){
    bacon.position.y=baconLocalY;
    bacon.position.x=0;
    bacon.position.z=0;

    bacon.rotation.x=0;
    bacon.rotation.z=0;

    if(moving){
      bacon.rotation.y=Math.atan2(x,z)+baconBaseYaw;
    }else{
      bacon.rotation.y=baconBaseYaw;
    }
  }

  if(action)action.paused=!moving;
  if(mixer)mixer.update(dt);

  // Re-lock after animation update.
  if(bacon){
    bacon.position.x=0;
    bacon.position.y=baconLocalY;
    bacon.position.z=0;
  }

  if(player.position.y<-15){
    player.position.copy(spawn);
    velocityY=0;
    grounded=true;
  }

  // Finish region.
  if(player.position.z<-88 && player.position.y>7){
    finished=true;
    document.getElementById("win").style.display="flex";
  }
}

/* ---------- LOOP ---------- */
const clock=new THREE.Clock();

function loop(){
  requestAnimationFrame(loop);

  const dt=Math.min(clock.getDelta(),.033);

  update(dt);
  updateCamera(dt);

  renderer.render(scene,camera);
}

loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
